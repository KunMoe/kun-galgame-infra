          type: string
          x-vocabulary-closed: true
        person_id:
          description: null if this name is not linked to a person.
          maxLength: 20
          pattern: ^[0-9]+$
          type:
            - string
            - "null"
      required:
        - object
        - id
        - display_name
        - latin
        - localized
        - person_id
      type: object
    Engine:
