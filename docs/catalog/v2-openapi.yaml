components:
  schemas:
    CatalogStats:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CatalogStats.json
          format: uri
          readOnly: true
          type: string
        characters:
          description: Live characters.
          format: int64
          minimum: 0
          type: integer
        companies:
          description: Company registry rows.
          format: int64
          minimum: 0
          type: integer
        credit_names:
          description: Live credit names.
          format: int64
          minimum: 0
          type: integer
        object:
          description: Type discriminant. Always catalog_stats.
          enum:
            - catalog_stats
          type: string
          x-vocabulary-closed: true
        persons:
          description: Live persons.
          format: int64
          minimum: 0
          type: integer
        works:
          description: Live works.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - works
        - companies
        - characters
        - credit_names
        - persons
      type: object
    Change:
      additionalProperties: true
      properties:
        id:
          description: Catalog id of the changed row.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        object:
          description: Type discriminant. Always change.
          enum:
            - change
          type: string
          x-vocabulary-closed: true
        target_object:
          description: Family of the row that changed.
          enum:
            - work
            - release
            - character
            - credit_name
            - person
            - company
            - tag
            - engine
          type: string
          x-vocabulary-closed: true
        updated_at:
          description: RFC 3339 UTC.
          format: date-time
          maxLength: 32
          type: string
      required:
        - object
        - target_object
        - id
        - updated_at
      type: object
    Character:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Character.json
          format: uri
          readOnly: true
          type: string
        birthday:
          description: "MM-DD. Present on view=full. null if unrecorded. Not a date: there is no year."
          maxLength: 5
          pattern: ^[0-1][0-9]-[0-3][0-9]$
          type: string
        blood_type:
          description: Present on view=full. null if unrecorded.
          enum:
            - a
            - b
            - ab
            - o
          type: string
          x-vocabulary-closed: true
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        gender:
          description: Present on view=full. null if unrecorded.
          enum:
            - male
            - female
            - other
          type: string
          x-vocabulary-closed: true
        height_cm:
          description: Present on view=full. null if unrecorded.
          format: int64
          minimum: 0
          type: integer
        id:
          description: Catalog character id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        instance_of_id:
          description: Another character this row is an instance of. Present on view=full. null if none.
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        measurements:
          $ref: "#/components/schemas/Measurements"
          description: Present on view=full. null if unrecorded.
        object:
          description: Type discriminant. Always character.
          enum:
            - character
          type: string
          x-vocabulary-closed: true
        weight_kg:
          description: Present on view=full. null if unrecorded.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - latin
        - localized
      type: object
    Claim:
      additionalProperties: true
      properties:
        content_limit:
          description: Editorial display axis for this claim.
          enum:
            - sfw
            - nsfw
          type: string
          x-vocabulary-closed: true
        site:
          description: Claiming site key.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        site_work_id:
          description: The site's own work id, not the catalog id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        state:
          description: Claim lifecycle state.
          enum:
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - site
        - site_work_id
        - state
        - content_limit
      type: object
    Company:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Company.json
          format: uri
          readOnly: true
          type: string
        company_kind:
          description: Company registry class. No other.
          enum:
            - game_brand
            - bunko
            - publisher
            - anime_studio
            - doujin_circle
            - group
          type: string
          x-vocabulary-closed: true
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog company id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always company.
          enum:
            - company
          type: string
          x-vocabulary-closed: true
        work_count:
          description: Works visible under the same NSFW gate.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - latin
        - localized
        - company_kind
        - work_count
      type: object
    CompanyGraph:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CompanyGraph.json
          format: uri
          readOnly: true
          type: string
        edges:
          description: Directed relations among nodes. Empty array, never null. Inverse relations are not emitted.
          items:
            $ref: "#/components/schemas/CompanyGraphEdge"
          type: array
        nodes:
          description: Companies in this family. Empty array, never null.
          items:
            $ref: "#/components/schemas/CompanyGraphNode"
          type: array
        object:
          description: Type discriminant. Always company_graph.
          enum:
            - company_graph
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - nodes
        - edges
      type: object
    CompanyGraphEdge:
      additionalProperties: true
      properties:
        from_id:
          description: Source company id. to_id is the named relation of from_id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        relation:
          description: to_id is this relation of from_id. Inverse edges are not emitted.
          enum:
            - parent
            - imprint
            - spawned
            - succeeded_by
          type: string
          x-vocabulary-closed: true
        to_id:
          description: Target company id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
      required:
        - from_id
        - to_id
        - relation
      type: object
    CompanyGraphNode:
      additionalProperties: true
      properties:
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog company id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always company.
          enum:
            - company
          type: string
          x-vocabulary-closed: true
        work_count:
          description: Works visible under the same NSFW gate.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - localized
        - work_count
      type: object
    Cover:
      additionalProperties: true
      properties:
        hash:
          description: Image-service content hash.
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          type: string
        height:
          description: Pixel height. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
        id:
          description: catalog_work_cover row id, not the image hash.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        portrait_pinned:
          description: Whether this row is pinned as the portrait cover.
          type: boolean
        sexual:
          description: Sexual depiction. null means not assessed.
          enum:
            - safe
            - suggestive
            - explicit
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        source:
          description: Open vocabulary sources. Must not be used as a discriminant.
          maxLength: 64
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
        thumbhash:
          description: Thumbhash. null if unknown.
          maxLength: 128
          pattern: ^[A-Za-z0-9+/=_-]+$
          type:
            - string
            - "null"
        url:
          description: Absolute image URL. Never a bare hash.
          format: uri
          maxLength: 512
          type: string
        violence:
          description: Violent depiction. null means not assessed. Currently always null.
          enum:
            - tame
            - violent
            - brutal
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        vote_count:
          description: Net votes on this cover row.
          format: int64
          minimum: 0
          type: integer
        width:
          description: Pixel width. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - id
        - vote_count
        - portrait_pinned
        - url
        - hash
        - width
        - height
        - thumbhash
        - sexual
        - violence
        - source
      type: object
    CreditEntry:
      additionalProperties: true
      properties:
        character_id:
          description: null if this credit is not a voice on a character.
          maxLength: 20
          pattern: ^[0-9]+$
