            description: Closed per-collection sort key.
            maxLength: 32
            type: string
        - description: true includes r18. Requires the NSFW capability. false or absent hides r18. Only true or false.
          explode: false
          in: query
          name: nsfw
          schema:
            description: true includes r18. Requires the NSFW capability. false or absent hides r18. Only true or false.
            maxLength: 8
            type: string
        - description: "Dated month window YYYY-MM. Default: current month in Asia/Tokyo."
          explode: false
          in: query
          name: month
          schema:
            description: "Dated month window YYYY-MM. Default: current month in Asia/Tokyo."
            maxLength: 7
            type: string
        - description: "Year-only window YYYY (v1 pending). Default with precision=year: current year in Asia/Tokyo."
          explode: false
          in: query
          name: year
          schema:
            description: "Year-only window YYYY (v1 pending). Default with precision=year: current year in Asia/Tokyo."
            maxLength: 4
            type: string
        - description: day, month, or year. year selects the year-only window. day and month use the dated month window.
