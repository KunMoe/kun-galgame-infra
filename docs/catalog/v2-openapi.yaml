components:
  schemas:
    Claim:
      additionalProperties: true
      properties:
        content_limit:
          description: Editorial display axis for this claim.
          enum:
            - sfw
            - nsfw
          type: string
          x-vocabulary-closed: true
        site:
          description: Claiming site key.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        site_work_id:
          description: The site's own work id, not the catalog id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        state:
          description: Claim lifecycle state.
          enum:
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - site
        - site_work_id
        - state
        - content_limit
      type: object
    Cover:
      additionalProperties: true
      properties:
        hash:
          description: Image-service content hash.
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          type: string
        height:
          description: Pixel height. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
        id:
          description: catalog_work_cover row id, not the image hash.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        portrait_pinned:
          description: Whether this row is pinned as the portrait cover.
          type: boolean
        sexual:
          description: Sexual depiction. null means not assessed.
          enum:
            - safe
            - suggestive
            - explicit
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        source:
          description: Open vocabulary sources. Must not be used as a discriminant.
          maxLength: 64
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
        thumbhash:
          description: Thumbhash. null if unknown.
          maxLength: 128
          pattern: ^[A-Za-z0-9+/=_-]+$
          type:
            - string
            - "null"
        url:
          description: Absolute image URL. Never a bare hash.
          format: uri
          maxLength: 512
          type: string
        violence:
          description: Violent depiction. null means not assessed. Currently always null.
          enum:
            - tame
            - violent
            - brutal
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        vote_count:
          description: Net votes on this cover row.
          format: int64
          minimum: 0
          type: integer
        width:
          description: Pixel width. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - id
        - vote_count
        - portrait_pinned
        - url
        - hash
        - width
        - height
        - thumbhash
        - sexual
        - violence
        - source
      type: object
    EntityName:
      additionalProperties: true
      properties:
        alias_kind:
          description: search_hint is internal and never appears on this type.
          enum:
            - translation
            - spelling_variant
          type: string
          x-vocabulary-closed: true
        is_machine:
          description: Whether this name is machine-translated.
          type: boolean
        lang:
          description: BCP-47 language tag.
          format: bcp47
          maxLength: 32
          type: string
        value:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
      required:
        - lang
        - value
        - alias_kind
        - is_machine
      type: object
    FieldError:
      additionalProperties: true
      properties:
        detail:
          description: English, request-specific. Must not be used as a discriminant.
          maxLength: 2048
          type: string
        header:
          description: Request header name. Exactly one of pointer, parameter, or header is set.
          maxLength: 64
          pattern: ^[A-Za-z0-9-]+$
          type: string
        parameter:
          description: Query or path parameter name. Exactly one of pointer, parameter, or header is set.
          maxLength: 64
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
        pointer:
          description: JSON Pointer (RFC 6901) into the request body. Exactly one of pointer, parameter, or header is set.
          maxLength: 256
          pattern: ^/
          type: string
        reason:
          description: Field-level reason from the closed reason registry.
          maxLength: 63
          pattern: ^[A-Z][A-Z0-9_]*[A-Z0-9]$
          type: string
      required:
        - reason
        - detail
      type: object
    Image:
      additionalProperties: true
      properties:
        hash:
          description: Image-service content hash.
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          type: string
        height:
          description: Pixel height. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
        sexual:
          description: Sexual depiction. null means not assessed.
          enum:
            - safe
            - suggestive
            - explicit
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        source:
          description: Open vocabulary sources. Must not be used as a discriminant.
          maxLength: 64
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
        thumbhash:
          description: Thumbhash. null if unknown.
          maxLength: 128
          pattern: ^[A-Za-z0-9+/=_-]+$
          type:
            - string
            - "null"
        url:
          description: Absolute image URL. Never a bare hash.
          format: uri
          maxLength: 512
          type: string
        violence:
          description: Violent depiction. null means not assessed. Currently no catalog row has an assessment; the value is always null.
          enum:
            - tame
            - violent
            - brutal
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        width:
          description: Pixel width. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - url
        - hash
        - width
        - height
        - thumbhash
        - sexual
        - violence
        - source
      type: object
    Intro:
      additionalProperties: true
      properties:
        is_machine:
          description: Whether this intro is machine-translated.
          type: boolean
        lang:
          description: BCP-47 language tag.
          format: bcp47
          maxLength: 32
          type: string
        source:
          description: Open vocabulary sources. Must not be used as a discriminant.
          maxLength: 64
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
        value:
          description: Must not be used as a discriminant.
          maxLength: 20000
          type: string
      required:
        - lang
        - value
        - is_machine
        - source
      type: object
    ListObjectProblemReason:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListObjectProblemReason.json
          format: uri
          readOnly: true
          type: string
        items:
          description: The members of this list. Empty array, never null.
          items:
            $ref: "#/components/schemas/ProblemReason"
          type: array
        object:
          description: Type discriminant. Always list.
          enum:
            - list
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - items
      type: object
    ListObjectProblemType:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListObjectProblemType.json
          format: uri
          readOnly: true
          type: string
        items:
          description: The members of this list. Empty array, never null.
          items:
            $ref: "#/components/schemas/ProblemType"
          type: array
        object:
          description: Type discriminant. Always list.
          enum:
            - list
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - items
      type: object
    ListObjectVocabulary:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListObjectVocabulary.json
          format: uri
          readOnly: true
          type: string
        items:
          description: The members of this list. Empty array, never null.
          items:
            $ref: "#/components/schemas/Vocabulary"
          type: array
        object:
          description: Type discriminant. Always list.
          enum:
            - list
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - items
      type: object
    LocalizedText:
      additionalProperties: true
      properties:
        is_machine:
          description: Whether this value is machine-translated.
          type: boolean
        value:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
      required:
        - value
        - is_machine
      type: object
    Names:
      additionalProperties: true
      properties:
        display_name:
          description: Primary label. Never empty. Must not be used as a discriminant.
          maxLength: 512
          type: string
        latin:
          description: Romanization. null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys, sparse. Empty object if none. Must not be used as a discriminant.
          type: object
      required:
        - display_name
        - latin
        - localized
      type: object
    Problem:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Problem.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Top-level error code from the closed registry. UPPER_SNAKE.
          maxLength: 63
          pattern: ^[A-Z][A-Z0-9_]*[A-Z0-9]$
          type: string
        detail:
          description: English, request-specific. Must not be used as a discriminant. Empty when there is nothing to add.
          maxLength: 2048
          type: string
        errors:
          description: Field-level failures. Empty array when this is not a field-level error.
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        instance:
          description: Request path and query string that failed. Empty only if the path is unknown.
          maxLength: 2048
          pattern: ^(/.*)?$
          type: string
        request_id:
          description: Same value as X-Request-ID. Prefix req_ plus a 26-character ULID.
          maxLength: 30
          minLength: 30
          pattern: ^req_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        status:
          description: HTTP status. Matches the response status line.
          format: int64
          maximum: 599
          minimum: 400
          type: integer
        title:
          description: Stable English phrase for this type. Does not vary per request.
          maxLength: 128
          pattern: ^[ -~]+$
          type: string
        type:
          description: Stable problem type URI of the form https://developer.nextmoe.dev/problems/{domain}/{kebab-code}.
          format: uri
          maxLength: 256
          type: string
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - request_id
        - errors
      type: object
    ProblemReason:
      additionalProperties: true
      properties:
        description:
          description: English prose. Must not be used as a discriminant.
          maxLength: 512
          type: string
        object:
          description: Type discriminant. Always problem_reason.
          enum:
            - problem_reason
          type: string
          x-vocabulary-closed: true
        reason:
          description: Field-level reason. UPPER_SNAKE. Disjoint from top-level codes.
          maxLength: 63
          pattern: ^[A-Z][A-Z0-9_]*[A-Z0-9]$
          type: string
        title:
          description: Stable English phrase for this reason.
          maxLength: 128
          pattern: ^[ -~]+$
          type: string
      required:
        - object
        - reason
        - title
        - description
      type: object
    ProblemType:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ProblemType.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Top-level error code. UPPER_SNAKE.
          maxLength: 63
          pattern: ^[A-Z][A-Z0-9_]*[A-Z0-9]$
          type: string
        description:
          description: English prose. Must not be used as a discriminant.
          maxLength: 512
          type: string
        domain:
          description: Type URI domain segment.
          enum:
            - platform
            - catalog
            - me
            - moderation
            - news
          type: string
          x-vocabulary-closed: true
        object:
          description: Type discriminant. Always problem_type.
          enum:
            - problem_type
          type: string
          x-vocabulary-closed: true
        status:
          description: HTTP status this code is bound to. One status per code.
          format: int64
          maximum: 599
          minimum: 400
          type: integer
        title:
          description: Stable English phrase for this type. Does not vary per request.
          maxLength: 128
          pattern: ^[ -~]+$
          type: string
        type:
          description: Problem type URI. The last path segment is the kebab-case form of code.
          format: uri
          maxLength: 256
          type: string
      required:
        - object
        - code
        - domain
        - status
        - type
        - title
        - description
      type: object
    Ref:
      additionalProperties: true
      properties:
        external_id:
          description: Verbatim upstream id. Must not be used as a discriminant beyond exact match.
          maxLength: 256
          type: string
        source:
          description: Open vocabulary sources. Must not be used as a discriminant.
          maxLength: 64
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
      required:
        - source
        - external_id
      type: object
    Value:
      additionalProperties: true
      properties:
        description:
          description: English prose. Must not be used as a discriminant.
          maxLength: 512
          type: string
        display_name:
          description: English label for this token. Must not be used as a discriminant.
          maxLength: 512
          type: string
        value:
          description: Token as it appears on the wire. Must not be used as a discriminant.
          maxLength: 64
          type: string
      required:
        - value
        - display_name
        - description
      type: object
    Vocabulary:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Vocabulary.json
          format: uri
          readOnly: true
          type: string
        closed:
          description: true if adding or removing a value is a breaking change.
          type: boolean
        name:
          description: Vocabulary name. The path segment of /v2/vocabularies/{name}.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        object:
          description: Type discriminant. Always vocabulary.
          enum:
            - vocabulary
          type: string
          x-vocabulary-closed: true
        values:
          description: Every value currently published. Empty array, never null.
          items:
            $ref: "#/components/schemas/Value"
          type: array
      required:
        - object
        - name
        - closed
        - values
      type: object
    Work:
      additionalProperties: true
      properties:
        banner:
          $ref: "#/components/schemas/Image"
          description: Selected landscape image. null if none.
        claim:
          $ref: "#/components/schemas/Claim"
          description: null if unclaimed. Never omitted on view=basic.
        content_rating:
          description: Age axis of the work.
          enum:
            - all_ages
            - sensitive
            - r18
          type: string
          x-vocabulary-closed: true
        cover:
          $ref: "#/components/schemas/Image"
          description: Selected portrait image. null if none.
        created_at:
          description: RFC 3339 UTC.
          format: date-time
          maxLength: 32
          type: string
        display_name:
          description: Primary label. Never empty. Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog work id. JSON string of a decimal integer.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        latin:
          description: Romanization. null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys, sparse. Empty object if none. Must not be used as a discriminant.
          type: object
        medium:
          description: Never null.
          enum:
            - galgame
            - manga
            - novel
            - anime
            - asmr
            - doujin_game
            - music
          type: string
          x-vocabulary-closed: true
        object:
          description: Type discriminant. Always work.
          enum:
            - work
          type: string
          x-vocabulary-closed: true
        olang:
          description: Original language, BCP-47. Open vocabulary languages.
          format: bcp47
          maxLength: 32
          type: string
        release_date:
          description: Calendar date. null when release_status is announced, cancelled, or unknown.
          format: date
          maxLength: 10
          type:
            - string
            - "null"
        release_date_precision:
          description: null when release_date is null. month dates sit on the 1st; year dates sit on January 1.
          enum:
            - day
            - month
            - year
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        release_status:
          description: World state of the release, distinct from our knowledge gap.
          enum:
            - released
            - dated
            - announced
            - cancelled
            - unknown
          type: string
          x-vocabulary-closed: true
        updated_at:
          description: RFC 3339 UTC.
          format: date-time
          maxLength: 32
          type: string
      required:
        - object
        - id
        - medium
        - display_name
        - latin
        - localized
        - olang
        - content_rating
        - release_date
        - release_date_precision
        - release_status
        - cover
        - banner
        - claim
        - created_at
        - updated_at
      type: object
    WorkTitle:
      additionalProperties: true
      properties:
        is_machine:
          description: Whether this title is machine-translated.
          type: boolean
        lang:
          description: BCP-47 language tag.
          format: bcp47
          maxLength: 32
          type: string
        latin:
          description: Romanization. null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        title:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        title_kind:
          description: search_hint is internal and never appears on this type.
          enum:
            - official
            - alias
            - abbreviation
          type: string
          x-vocabulary-closed: true
      required:
        - lang
        - title
        - latin
        - title_kind
        - is_machine
      type: object
info:
  description: "NextMoe public API v2. Preview: any change is allowed, including deletions and renames. Third parties are not issued /v2 credentials."
  title: NextMoe Public API v2
  version: 2.0.0-preview
  x-stability: preview
openapi: 3.1.0
paths:
  /v2/problems:
    get:
      description: The closed registry of top-level error codes. Unauthenticated. This list is the machine-readable form of the same registry the problem type URIs resolve against.
      operationId: listProblemTypes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectProblemType"
          description: OK
        "304":
          description: Not Modified. The representation is unchanged.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List every top-level error code
      tags:
        - meta
  /v2/problems/reasons:
    get:
      description: The closed registry of field-level reasons. Unauthenticated. Values in this list never appear as top-level codes.
      operationId: listProblemReasons
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectProblemReason"
          description: OK
        "304":
          description: Not Modified. The representation is unchanged.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List every field-level error reason
      tags:
        - meta
  /v2/problems/{code}:
    get:
      description: Returns the registry entry for one code. Unknown codes are 404 NOT_FOUND, not 422 — the path parameter is a lookup key, not a closed enum.
      operationId: getProblemType
      parameters:
        - description: Top-level error code from the registry (UPPER_SNAKE).
          in: path
          name: code
          required: true
          schema:
            description: Top-level error code from the registry (UPPER_SNAKE).
            maxLength: 63
            pattern: ^[A-Z][A-Z0-9_]*[A-Z0-9]$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemType"
          description: OK
        "304":
          description: Not Modified. The representation is unchanged.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get one top-level error code
      tags:
        - meta
  /v2/vocabularies:
    get:
      description: Closed vocabularies are part of the code. Open vocabularies currently publish their seed values; live distinct-from-data overlay arrives with the catalog resource wave.
      operationId: listVocabularies
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectVocabulary"
          description: OK
        "304":
          description: Not Modified. The representation is unchanged.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List published vocabularies
      tags:
        - meta
  /v2/vocabularies/{name}:
    get:
      description: Returns every published value of one vocabulary. Unknown names are 404 NOT_FOUND.
      operationId: getVocabulary
      parameters:
        - description: Vocabulary name. The path segment of /v2/vocabularies/{name}.
          in: path
          name: name
          required: true
          schema:
            description: Vocabulary name. The path segment of /v2/vocabularies/{name}.
            maxLength: 63
            pattern: ^[a-z][a-z0-9_]*$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vocabulary"
          description: OK
        "304":
          description: Not Modified. The representation is unchanged.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get one vocabulary
      tags:
        - meta
servers:
  - description: Production. Paths in this document already include the /v2 prefix.
    url: https://api.nextmoe.dev
