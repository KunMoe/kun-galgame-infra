          type: array
        role_key:
          description: Credit role token.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        role_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
      required:
        - role_key
        - role_name
        - credits
      type: object
    CreditName:
