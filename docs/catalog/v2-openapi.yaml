info:
  description: "NextMoe public API v2. Preview: any change is allowed, including deletions and renames. Third parties are not issued /v2 credentials."
  title: NextMoe Public API v2
  version: 2.0.0-preview
  x-stability: preview
openapi: 3.1.0
paths:
  /v2/catalog/calendar:
    get:
      description: One collection. month=/year= pick a window; precision= and status= select among the dated month, year-only, and undated views that were three v1 routes. Requires an application key. ids= is not accepted.
      operationId: listCatalogCalendar
      parameters:
        - description: "Dated month window YYYY-MM. Default: current month in Asia/Tokyo."
          explode: false
          in: query
          name: month
          schema:
            description: "Dated month window YYYY-MM. Default: current month in Asia/Tokyo."
            maxLength: 7
            type: string
        - description: "Year-only window YYYY (v1 pending). Default with precision=year: current year in Asia/Tokyo."
          explode: false
          in: query
          name: year
          schema:
            description: "Year-only window YYYY (v1 pending). Default with precision=year: current year in Asia/Tokyo."
            maxLength: 4
            type: string
        - description: day, month, or year. year selects the year-only window. day and month use the dated month window.
          explode: false
          in: query
          name: precision
          schema:
            description: day, month, or year. year selects the year-only window. day and month use the dated month window.
            maxLength: 8
            type: string
        - description: released, dated, announced, cancelled, unknown. announced and unknown select the undated window. cancelled is empty until the catalog records cancellations.
          explode: false
          in: query
          name: status
          schema:
            description: released, dated, announced, cancelled, unknown. announced and unknown select the undated window. cancelled is empty until the catalog records cancellations.
            maxLength: 16
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWork"
          description: OK
        "304":
          description: Not Modified. The representation is unchanged.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Release calendar
      tags:
        - catalog
  /v2/catalog/changes:
    get:
      description: Works updated recently, oldest first. Keyset-paginated. Requires an application key. ids= is not accepted.
      operationId: listCatalogChanges
      parameters:
        - description: Opaque keyset cursor from a prior next_cursor. Must start with cur_.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior next_cursor. Must start with cur_.
            maxLength: 512
            type: string
        - description: Page size 1-100, default 20. Values above 100 are 400 LIMIT_TOO_LARGE, not clamped.
          explode: false
          in: query
          name: limit
          schema:
            description: Page size 1-100, default 20. Values above 100 are 400 LIMIT_TOO_LARGE, not clamped.
            maxLength: 8
            type: string
        - description: basic (default) or full. Closed vocabulary.
          explode: false
          in: query
          name: view
          schema:
            description: basic (default) or full. Closed vocabulary.
            maxLength: 16
            type: string
        - description: Comma-separated blocks. Unknown token is 400 UNKNOWN_INCLUDE.
          explode: false
          in: query
          name: include
          schema:
            description: Comma-separated blocks. Unknown token is 400 UNKNOWN_INCLUDE.
            maxLength: 1024
            type: string
        - description: Comma-separated top-level keys after view/include. Unknown token is 400 UNKNOWN_FIELD. object and id are always kept.
          explode: false
          in: query
          name: fields
          schema:
            description: Comma-separated top-level keys after view/include. Unknown token is 400 UNKNOWN_FIELD. object and id are always kept.
            maxLength: 1024
            type: string
        - description: "Comma-separated ids, max 100. Batch lane: no pagination."
          explode: false
          in: query
          name: ids
          schema:
            description: "Comma-separated ids, max 100. Batch lane: no pagination."
            maxLength: 4096
            type: string
        - description: "Comma-separated source:external_id, max 100. Batch lane: no pagination."
          explode: false
          in: query
          name: refs
          schema:
            description: "Comma-separated source:external_id, max 100. Batch lane: no pagination."
            maxLength: 4096
            type: string
        - description: true to include total. Only true or false.
          explode: false
          in: query
          name: include_total
          schema:
            description: true to include total. Only true or false.
            maxLength: 8
            type: string
        - description: Comma-separated facet names. Unknown token is 400 UNKNOWN_FACET.
          explode: false
          in: query
          name: facets
          schema:
            description: Comma-separated facet names. Unknown token is 400 UNKNOWN_FACET.
            maxLength: 512
            type: string
        - description: Closed per-collection sort key.
          explode: false
          in: query
          name: sort
          schema:
            description: Closed per-collection sort key.
            maxLength: 32
            type: string
        - description: true includes r18. Requires the NSFW capability. false or absent hides r18. Only true or false.
          explode: false
          in: query
          name: nsfw
          schema:
            description: true includes r18. Requires the NSFW capability. false or absent hides r18. Only true or false.
            maxLength: 8
            type: string
      responses:
