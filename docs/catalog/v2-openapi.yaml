    EntityName:
      additionalProperties: true
      properties:
        alias_kind:
          description: search_hint is internal and never appears on this type.
          enum:
            - translation
            - spelling_variant
          type: string
          x-vocabulary-closed: true
        is_machine:
          description: Whether this name is machine-translated.
          type: boolean
        lang:
          description: BCP-47 language tag.
          format: bcp47
          maxLength: 32
          type: string
        value:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
      required:
        - lang
        - value
        - alias_kind
        - is_machine
      type: object
    FacetValue:
      additionalProperties: true
      properties:
        count:
          description: Hits in this bucket after the same filters as items.
          format: int64
          minimum: 0
          type: integer
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        value:
          description: Token to pass back to the same filter. Must not be used as a discriminant.
          maxLength: 256
          type: string
      required:
        - value
        - display_name
        - count
      type: object
    FieldError:
      additionalProperties: true
      properties:
        detail:
          description: English, request-specific. Must not be used as a discriminant.
          maxLength: 2048
          type: string
        header:
          description: Request header name. Exactly one of pointer, parameter, or header is set.
          maxLength: 64
          pattern: ^[A-Za-z0-9-]+$
          type: string
        parameter:
          description: Query or path parameter name. Exactly one of pointer, parameter, or header is set.
          maxLength: 64
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
        pointer:
          description: JSON Pointer (RFC 6901) into the request body. Exactly one of pointer, parameter, or header is set.
          maxLength: 256
          pattern: ^/
          type: string
        reason:
          description: Field-level reason from the closed reason registry.
          maxLength: 63
          pattern: ^[A-Z][A-Z0-9_]*[A-Z0-9]$
          type: string
      required:
        - reason
        - detail
      type: object
