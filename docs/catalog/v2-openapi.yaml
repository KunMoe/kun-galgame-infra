          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always credit_name.
          enum:
            - credit_name
          type: string
          x-vocabulary-closed: true
        person_id:
          description: null if this name is not linked to a person.
          maxLength: 20
          pattern: ^[0-9]+$
          type:
            - string
            - "null"
      required:
        - object
        - id
        - display_name
        - latin
        - localized
        - person_id
      type: object
    Engine:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Engine.json
          format: uri
          readOnly: true
          type: string
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
