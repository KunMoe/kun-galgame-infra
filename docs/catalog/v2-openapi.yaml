components:
  schemas:
    AmendProposalInputBody:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AmendProposalInputBody.json
          format: uri
          readOnly: true
          type: string
        note:
          description: Must not be used as a discriminant.
          maxLength: 2000
          type: string
        set:
          additionalProperties: {}
          description: Field-key to corrected value.
          type: object
        unset:
          description: Field keys to drop.
          items:
            type: string
          type: array
      type: object
    Amendment:
      additionalProperties: true
      properties:
        amender_uid:
          description: The claiming site's own user id of the amender. Not a catalog id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        created_at:
          description: RFC 3339 UTC.
          format: date-time
          maxLength: 32
          type: string
        id:
          description: Amendment id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        note:
          description: Amender's own summary. Must not be used as a discriminant.
          maxLength: 2000
          type: string
        object:
          description: Type discriminant. Always amendment.
          enum:
            - amendment
          type: string
          x-vocabulary-closed: true
        seq:
          description: Position in this proposal's amendment chain.
          format: int64
          minimum: 1
          type: integer
      required:
        - object
        - id
        - seq
        - amender_uid
        - note
        - created_at
      type: object
    Appearance:
      additionalProperties: true
      properties:
        object:
          description: Type discriminant. Always appearance.
          enum:
            - appearance
          type: string
          x-vocabulary-closed: true
        roster_role:
          description: Appearance strength on this work.
          enum:
            - main
            - secondary
            - appears
            - unknown
          type: string
          x-vocabulary-closed: true
        spoiler:
          description: Spoiler level of this appearance.
          enum:
            - none
            - minor
            - major
          type: string
          x-vocabulary-closed: true
        voices:
          description: Voice credits on this appearance. Empty array, never null.
          items:
            $ref: "#/components/schemas/CreditName"
          type: array
        work:
          $ref: "#/components/schemas/Work"
          description: Work this character appears on. view=basic.
      required:
        - object
        - work
        - roster_role
        - spoiler
        - voices
      type: object
    BatchPlaytimesInputBody:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/BatchPlaytimesInputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: At most 100 items.
          items:
            $ref: "#/components/schemas/Item"
          type: array
      required:
        - items
      type: object
    CatalogStats:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CatalogStats.json
          format: uri
          readOnly: true
          type: string
        characters:
          description: Live characters.
          format: int64
          minimum: 0
          type: integer
        companies:
          description: Company registry rows.
          format: int64
          minimum: 0
          type: integer
        credit_names:
          description: Live credit names.
          format: int64
          minimum: 0
          type: integer
        object:
          description: Type discriminant. Always catalog_stats.
          enum:
            - catalog_stats
          type: string
          x-vocabulary-closed: true
        persons:
          description: Live persons.
          format: int64
          minimum: 0
          type: integer
        works:
          description: Live works.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - works
        - companies
        - characters
        - credit_names
        - persons
      type: object
    Change:
      additionalProperties: true
      properties:
        id:
          description: Catalog id of the changed row.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        object:
          description: Type discriminant. Always change.
          enum:
            - change
          type: string
          x-vocabulary-closed: true
        target_object:
          description: Family of the row that changed.
          enum:
            - work
            - release
            - character
            - credit_name
            - person
            - company
            - tag
            - engine
          type: string
          x-vocabulary-closed: true
        updated_at:
          description: RFC 3339 UTC.
          format: date-time
          maxLength: 32
          type: string
      required:
        - object
        - target_object
        - id
        - updated_at
      type: object
    Character:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Character.json
          format: uri
          readOnly: true
          type: string
        birthday:
          description: "MM-DD. Present on view=full. null if unrecorded. Not a date: there is no year."
          maxLength: 5
          pattern: ^[0-1][0-9]-[0-3][0-9]$
          type: string
        blood_type:
          description: Present on view=full. null if unrecorded.
          enum:
            - a
            - b
            - ab
            - o
          type: string
          x-vocabulary-closed: true
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        gender:
          description: Present on view=full. null if unrecorded.
          enum:
            - male
            - female
            - other
          type: string
          x-vocabulary-closed: true
        height_cm:
          description: Present on view=full. null if unrecorded.
          format: int64
          minimum: 0
          type: integer
        id:
          description: Catalog character id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        instance_of_id:
          description: Another character this row is an instance of. Present on view=full. null if none.
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        measurements:
          $ref: "#/components/schemas/Measurements"
          description: Present on view=full. null if unrecorded.
        object:
          description: Type discriminant. Always character.
          enum:
            - character
          type: string
          x-vocabulary-closed: true
        weight_kg:
          description: Present on view=full. null if unrecorded.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - latin
        - localized
      type: object
    Claim:
      additionalProperties: true
      properties:
        content_limit:
          description: Editorial display axis for this claim.
          enum:
            - sfw
            - nsfw
          type: string
          x-vocabulary-closed: true
        site:
          description: Claiming site key.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        site_work_id:
          description: The site's own work id, not the catalog id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        state:
          description: Claim lifecycle state.
          enum:
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - site
        - site_work_id
        - state
        - content_limit
      type: object
    ClaimRecord:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ClaimRecord.json
          format: uri
          readOnly: true
          type: string
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog work id this claim is on.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        object:
          description: Type discriminant. Always claim.
          enum:
            - claim
          type: string
          x-vocabulary-closed: true
        state:
          description: Claim lifecycle state.
          enum:
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - id
        - state
        - display_name
      type: object
    ClaimRefBody:
      additionalProperties: true
      properties:
        external_id:
          description: Verbatim upstream id. Must not be used as a discriminant beyond exact match.
          maxLength: 256
          minLength: 1
          type: string
        source:
          description: Open vocabulary source key such as vndb. Must not be used as a discriminant.
          maxLength: 64
          minLength: 1
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
      required:
        - source
        - external_id
      type: object
    Company:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Company.json
          format: uri
          readOnly: true
          type: string
        company_kind:
          description: Company registry class. No other.
          enum:
            - game_brand
            - bunko
            - publisher
            - anime_studio
            - doujin_circle
            - group
          type: string
          x-vocabulary-closed: true
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog company id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always company.
          enum:
            - company
          type: string
          x-vocabulary-closed: true
        work_count:
          description: Works visible under the same NSFW gate.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - latin
        - localized
        - company_kind
        - work_count
      type: object
    CompanyGraph:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CompanyGraph.json
          format: uri
          readOnly: true
          type: string
        edges:
          description: Directed relations among nodes. Empty array, never null. Inverse relations are not emitted.
          items:
            $ref: "#/components/schemas/CompanyGraphEdge"
          type: array
        nodes:
          description: Companies in this family. Empty array, never null.
          items:
            $ref: "#/components/schemas/CompanyGraphNode"
          type: array
        object:
          description: Type discriminant. Always company_graph.
          enum:
            - company_graph
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - nodes
        - edges
      type: object
    CompanyGraphEdge:
      additionalProperties: true
      properties:
        from_id:
          description: Source company id. to_id is the named relation of from_id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        relation:
          description: to_id is this relation of from_id. Inverse edges are not emitted.
          enum:
            - parent
            - imprint
            - spawned
            - succeeded_by
          type: string
          x-vocabulary-closed: true
        to_id:
          description: Target company id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
      required:
        - from_id
        - to_id
        - relation
      type: object
    CompanyGraphNode:
      additionalProperties: true
      properties:
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog company id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always company.
          enum:
            - company
          type: string
          x-vocabulary-closed: true
        work_count:
          description: Works visible under the same NSFW gate.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - localized
        - work_count
      type: object
    Cover:
      additionalProperties: true
      properties:
        hash:
          description: Image-service content hash.
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          type: string
        height:
          description: Pixel height. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
        id:
          description: catalog_work_cover row id, not the image hash.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        portrait_pinned:
          description: Whether this row is pinned as the portrait cover.
          type: boolean
        sexual:
          description: Sexual depiction. null means not assessed.
          enum:
            - safe
            - suggestive
            - explicit
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        source:
          description: Open vocabulary sources. Must not be used as a discriminant.
          maxLength: 64
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
        thumbhash:
          description: Thumbhash. null if unknown.
          maxLength: 128
          pattern: ^[A-Za-z0-9+/=_-]+$
          type:
            - string
            - "null"
        url:
          description: Absolute image URL. Never a bare hash.
          format: uri
          maxLength: 512
          type: string
        violence:
          description: Violent depiction. null means not assessed. Currently always null.
          enum:
            - tame
            - violent
            - brutal
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        vote_count:
          description: Net votes on this cover row.
          format: int64
          minimum: 0
          type: integer
        width:
          description: Pixel width. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - id
        - vote_count
        - portrait_pinned
        - url
        - hash
        - width
        - height
        - thumbhash
        - sexual
        - violence
        - source
      type: object
    CoverVote:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CoverVote.json
          format: uri
          readOnly: true
          type: string
        cover_id:
          description: Catalog cover row id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        object:
          description: Type discriminant. Always cover_vote.
          enum:
            - cover_vote
          type: string
          x-vocabulary-closed: true
        vote:
          description: Only up is stored. down is not a catalog ballot.
          enum:
            - up
          type: string
          x-vocabulary-closed: true
        work_id:
          description: Work the ballot is on.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
      required:
        - object
        - cover_id
        - work_id
        - vote
      type: object
    CreateClaimInputBody:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateClaimInputBody.json
          format: uri
          readOnly: true
          type: string
        display_name:
          description: Required to mint when refs do not match. Must not be used as a discriminant.
          maxLength: 512
          type: string
        refs:
          description: source:external_id anchors. Used when work_id is absent.
          items:
            $ref: "#/components/schemas/ClaimRefBody"
          type: array
        site_work_id:
          description: The site's own work id.
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        work_id:
          description: Existing catalog work id to claim.
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
      type: object
    CreateProposalInputBody:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateProposalInputBody.json
          format: uri
          readOnly: true
          type: string
        entity_id:
          description: Target catalog id.
          maxLength: 20
          pattern: ^[0-9]+$
          type: string
        entity_type:
          description: Editing-engine type, e.g. catalog.work. Must not be used as a discriminant.
          maxLength: 64
          type: string
        note:
          description: Must not be used as a discriminant.
          maxLength: 2000
          type: string
        patch:
          additionalProperties: {}
          description: Field-key to new value.
          type: object
      required:
        - entity_type
        - entity_id
        - patch
      type: object
    CreditEntry:
      additionalProperties: true
      properties:
        character_id:
          description: null if this credit is not a voice on a character.
          maxLength: 20
          pattern: ^[0-9]+$
          type:
            - string
            - "null"
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog credit-name id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always credit_name.
          enum:
            - credit_name
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - id
        - display_name
        - latin
        - localized
        - character_id
      type: object
    CreditGroup:
      additionalProperties: true
      properties:
        credits:
          description: Names credited in this role. Empty array, never null.
          items:
            $ref: "#/components/schemas/CreditEntry"
          type: array
        role_key:
          description: Credit role token.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        role_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
      required:
        - role_key
        - role_name
        - credits
      type: object
    CreditName:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreditName.json
          format: uri
          readOnly: true
          type: string
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog credit-name id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always credit_name.
          enum:
            - credit_name
          type: string
          x-vocabulary-closed: true
        person_id:
          description: null if this name is not linked to a person.
          maxLength: 20
          pattern: ^[0-9]+$
          type:
            - string
            - "null"
      required:
        - object
        - id
        - display_name
        - latin
        - localized
        - person_id
      type: object
    DecideClaimInputBody:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/DecideClaimInputBody.json
          format: uri
          readOnly: true
          type: string
        decision:
          description: approve publishes a pending claim, decline sends it back, ban hides it from any state, unban restores the state it was hidden from.
          enum:
            - approve
            - decline
            - ban
            - unban
          type: string
          x-vocabulary-closed: true
        note:
          description: Must not be used as a discriminant. Required to decline.
          maxLength: 2000
          type: string
      required:
        - decision
      type: object
    DecideProposalInputBody:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/DecideProposalInputBody.json
          format: uri
          readOnly: true
          type: string
        decision:
          description: merge writes the effective patch and records a revision. decline closes the proposal.
          enum:
            - merge
            - decline
          type: string
          x-vocabulary-closed: true
        note:
          description: Must not be used as a discriminant.
          maxLength: 2000
          type: string
      required:
        - decision
      type: object
    DecisionRecord:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/DecisionRecord.json
          format: uri
          readOnly: true
          type: string
        decision:
          description: Claim decisions are approve, decline, ban, or unban. Proposal decisions are merge or decline.
          enum:
            - approve
            - decline
            - merge
            - ban
            - unban
          type: string
          x-vocabulary-closed: true
        id:
          description: Decision event id when the backend issues one, else the subject id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        note:
          description: Must not be used as a discriminant.
          maxLength: 2000
          type: string
        object:
          description: Type discriminant. Always decision.
          enum:
            - decision
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - id
        - decision
        - note
      type: object
    EditImage:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EditImage.json
          format: uri
          readOnly: true
          type: string
        hash:
          description: Image-service content hash. This is the value an edit proposal carries.
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          type: string
        height:
          description: Pixel height. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
        is_deduplicated:
          description: True when these bytes already existed and no new object was stored.
          type: boolean
        object:
          description: Type discriminant. Always edit_image.
          enum:
            - edit_image
          type: string
          x-vocabulary-closed: true
        preset:
          description: Which editor slot these bytes were sized for.
          enum:
            - cover
            - screenshot
          type: string
          x-vocabulary-closed: true
        sexual:
          description: Sexual depiction. null means not assessed. An upload receipt is always null; the assessment lands later.
          enum:
            - safe
            - suggestive
            - explicit
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        size_bytes:
          description: Stored byte length after the image service re-encoded the upload.
          format: int64
          minimum: 0
          type: integer
        thumbhash:
          description: Thumbhash. null if unknown.
          maxLength: 128
          pattern: ^[A-Za-z0-9+/=_-]+$
          type:
            - string
            - "null"
        url:
          description: Absolute image URL. Never a bare hash.
          format: uri
          maxLength: 512
          type: string
        violence:
          description: Violent depiction. null means not assessed. Currently always null.
          enum:
            - tame
            - violent
            - brutal
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        width:
          description: Pixel width. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
