components:
  schemas:
    CatalogStats:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CatalogStats.json
          format: uri
          readOnly: true
          type: string
        characters:
          description: Live characters.
          format: int64
          minimum: 0
          type: integer
        companies:
          description: Company registry rows.
          format: int64
          minimum: 0
          type: integer
        credit_names:
          description: Live credit names.
          format: int64
          minimum: 0
          type: integer
        object:
          description: Type discriminant. Always catalog_stats.
          enum:
            - catalog_stats
          type: string
          x-vocabulary-closed: true
        persons:
          description: Live persons.
          format: int64
          minimum: 0
          type: integer
        works:
          description: Live works.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - works
        - companies
        - characters
        - credit_names
        - persons
      type: object
    Character:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Character.json
          format: uri
          readOnly: true
          type: string
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog character id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always character.
          enum:
            - character
          type: string
          x-vocabulary-closed: true
      required:
        - object
        - id
        - display_name
        - latin
        - localized
      type: object
    Claim:
      additionalProperties: true
      properties:
        content_limit:
          description: Editorial display axis for this claim.
          enum:
            - sfw
            - nsfw
          type: string
          x-vocabulary-closed: true
        site:
          description: Claiming site key.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        site_work_id:
          description: The site's own work id, not the catalog id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        state:
          description: Claim lifecycle state.
          enum:
            - live
            - draft
            - pending
            - declined
            - hidden
          type: string
          x-vocabulary-closed: true
      required:
        - site
        - site_work_id
        - state
        - content_limit
      type: object
    Company:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Company.json
          format: uri
          readOnly: true
          type: string
        company_kind:
          description: Company registry class. No other.
          enum:
            - game_brand
            - bunko
            - publisher
            - anime_studio
            - doujin_circle
            - group
          type: string
          x-vocabulary-closed: true
        display_name:
          description: Must not be used as a discriminant.
          maxLength: 512
          type: string
        id:
          description: Catalog company id.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        latin:
          description: null if unrecorded. Must not be used as a discriminant.
          maxLength: 512
          type:
            - string
            - "null"
        localized:
          additionalProperties:
            $ref: "#/components/schemas/LocalizedText"
          description: BCP-47 keys. Empty object if none. Must not be used as a discriminant.
          type: object
        object:
          description: Type discriminant. Always company.
          enum:
            - company
          type: string
          x-vocabulary-closed: true
        work_count:
          description: Works visible under the same NSFW gate.
          format: int64
          minimum: 0
          type: integer
      required:
        - object
        - id
        - display_name
        - latin
        - localized
        - company_kind
        - work_count
      type: object
    Cover:
      additionalProperties: true
      properties:
        hash:
          description: Image-service content hash.
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          type: string
        height:
          description: Pixel height. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
        id:
          description: catalog_work_cover row id, not the image hash.
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]+$
          type: string
        portrait_pinned:
          description: Whether this row is pinned as the portrait cover.
          type: boolean
        sexual:
          description: Sexual depiction. null means not assessed.
          enum:
            - safe
            - suggestive
            - explicit
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        source:
          description: Open vocabulary sources. Must not be used as a discriminant.
          maxLength: 64
          type: string
          x-vocabulary: sources
          x-vocabulary-closed: false
        thumbhash:
          description: Thumbhash. null if unknown.
          maxLength: 128
          pattern: ^[A-Za-z0-9+/=_-]+$
          type:
            - string
            - "null"
        url:
          description: Absolute image URL. Never a bare hash.
          format: uri
          maxLength: 512
          type: string
        violence:
          description: Violent depiction. null means not assessed. Currently always null.
          enum:
            - tame
            - violent
            - brutal
          type:
            - string
            - "null"
          x-vocabulary-closed: true
        vote_count:
          description: Net votes on this cover row.
          format: int64
          minimum: 0
          type: integer
        width:
          description: Pixel width. null if unknown.
          format: int64
          maximum: 65535
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - id
        - vote_count
        - portrait_pinned
        - url
        - hash
        - width
        - height
        - thumbhash
        - sexual
        - violence
        - source
      type: object
    CreditName:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
