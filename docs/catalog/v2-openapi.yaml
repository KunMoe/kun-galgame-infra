paths:
  /v2/catalog/characters/{id}:
    get:
      description: Character detail. Merged ids are 404 ENTITY_MERGED. Requires an application key.
      operationId: getCatalogCharacter
      parameters:
        - description: Decimal catalog id.
          in: path
          name: id
          required: true
          schema:
            description: Decimal catalog id.
            maxLength: 20
            minLength: 1
            pattern: ^[0-9]+$
            type: string
        - description: true includes r18. Requires the NSFW capability. false or absent hides r18. Only true or false.
          explode: false
          in: query
          name: nsfw
          schema:
            description: true includes r18. Requires the NSFW capability. false or absent hides r18. Only true or false.
            maxLength: 8
            type: string
        - description: basic (default) or full. Closed vocabulary.
          explode: false
          in: query
          name: view
          schema:
            description: basic (default) or full. Closed vocabulary.
            maxLength: 16
            type: string
        - description: Comma-separated blocks. Unknown token is 400 UNKNOWN_INCLUDE.
          explode: false
          in: query
          name: include
          schema:
            description: Comma-separated blocks. Unknown token is 400 UNKNOWN_INCLUDE.
            maxLength: 1024
            type: string
        - description: Comma-separated top-level keys. Unknown token is 400 UNKNOWN_FIELD. object and id are always kept.
          explode: false
          in: query
          name: fields
          schema:
            description: Comma-separated top-level keys. Unknown token is 400 UNKNOWN_FIELD. object and id are always kept.
            maxLength: 1024
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
          description: OK
        "304":
          description: Not Modified. The representation is unchanged.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Get one character
      tags:
        - catalog
