        - entity_id
        - to_seq
      type: object
    UserWorkCover:
      additionalProperties: false
      properties:
        id:
          description: catalog_work_cover row id (the vote endpoints' cover id)
          format: int64
          type: integer
        image_hash:
          type: string
        vote_count:
          description: advisory best-cover votes on this cover
          format: int64
          type: integer
        voted:
          description: true if the token user's ballot is on this cover
          type: boolean
      required:
        - id
        - image_hash
        - vote_count
        - voted
      type: object
    UserWorkCoversResponse:
      additionalProperties: false
      properties:
        covers:
          items:
            $ref: "#/components/schemas/UserWorkCover"
          type:
            - array
            - "null"
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - covers
      type: object
    UserWorkSubmitRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UserWorkSubmitRequest.json
          format: uri
          readOnly: true
          type: string
        fields:
          additionalProperties: {}
          description: "Field-key → value, the submission subset of catalog.work: display_name (required), olang, content_rating, titles, intros, display_nsfw, tag_ids, labels, engine_ids, series_ids, links. covers/screenshots are NOT accepted here — upload the bytes, then edit those facets"
          type: object
        product_work_id:
          description: "The product-side work id to anchor this submission at. OMIT IT to have the registry issue the identity: the claim then adopts the minted work id, which the response returns. Idempotency depends on this choice — see the endpoint summary"
          format: int64
          minimum: 1
          type: integer
        released:
          $ref: "#/components/schemas/WorkSubmitDate"
          description: Optional submitted release date; becomes ONE curated catalog_release row. Omit for TBA
      required:
        - fields
      type: object
    VoiceName:
      additionalProperties: false
      properties:
        credit_name_id:
          format: int64
          type: integer
        lang:
          type: string
        latin:
          type: string
        name:
          type: string
      required:
        - credit_name_id
        - name
        - lang
      type: object
    WorkBrief:
      additionalProperties: false
      properties:
        content_rating:
          description: 0=all_ages 1=sensitive 2=r18
          format: int32
          type: integer
        display_name:
          type: string
        medium_id:
          format: int32
          type: integer
        site:
          type: string
        status:
          description: 0=live 1=stub 2=merged
          format: int32
          type: integer
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - display_name
        - medium_id
        - content_rating
        - status
      type: object
    WorkByAnchorResponse:
      additionalProperties: false
      properties:
        characters:
          items:
