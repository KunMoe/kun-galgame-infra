                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Withdraw the bearer token's own best-cover vote on this work. Idempotent (no vote to withdraw is still a 200); the cover id is part of the symmetric path and need not match the voted one — a user holds at most one ballot per work
      tags:
        - catalog-user
    put:
      operationId: voteCatalogWorkCoverUser
      parameters:
        - description: Catalog work id
          in: path
          name: workID
          required: true
          schema:
            description: Catalog work id
            format: int64
            minimum: 1
            type: integer
        - description: catalog_work_cover row id, as returned by the work detail's covers[].id
          in: path
          name: coverID
          required: true
          schema:
            description: catalog_work_cover row id, as returned by the work detail's covers[].id
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCoverVoteResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Vote for this work's best cover AS THE BEARER TOKEN'S OWN USER. No body: the voter is the token's user and the site is the token's client's catalog site. ONE ballot per user per WORK — voting a different cover MOVES the vote. Advisory only: votes never reorder covers and never touch the editorial pins"
      tags:
        - catalog-user
