        - ratings
        - tags
        - popularity
        - playtimes
        - series
        - platforms
        - relations
        - series_siblings
      type: object
    WorkCharacter:
      additionalProperties: false
      properties:
        character_id:
          format: int64
          type: integer
        display_name:
          type: string
        figure_hash:
          type: string
        gender:
          format: int32
          type: integer
        identity:
          description: Opaque row identity for catalog.work.roster.suppressed; echo it back, never rebuild it. Present when the character is on the roster; ABSENT when it appears only through a voice credit, in which case kind and spoiler are 0 and the row is edited via /works/{id}/credits
          type: string
        image_hash:
          type: string
        kind:
          description: "appearance strength: 0=unknown 1=main 2=secondary 3=appears"
          format: int32
          type: integer
        latin:
          type: string
        spoiler:
          description: "appearance spoiler level: 0=none 1=minor 2=major"
          format: int32
          type: integer
        va:
          items:
            $ref: "#/components/schemas/WorkCharacterVA"
          type:
            - array
            - "null"
      required:
        - character_id
        - display_name
        - kind
        - spoiler
        - va
      type: object
    WorkCharacterVA:
      additionalProperties: false
      properties:
        credit_name_id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - credit_name_id
        - name
      type: object
    WorkCore:
      additionalProperties: false
      properties:
        content_rating:
          description: 0=all_ages 1=sensitive 2=r18
          format: int32
          type: integer
        display_name:
          type: string
        id:
          format: int64
          type: integer
        medium_id:
          format: int32
          type: integer
        olang:
          type: string
        product_work_id:
          format: int64
          type: integer
        site:
          type: string
        status:
          description: 0=live 1=stub 2=merged
          format: int32
          type: integer
      required:
        - id
        - medium_id
        - display_name
        - olang
        - content_rating
        - status
      type: object
    WorkCover:
      additionalProperties: false
      properties:
        id:
          description: catalog_work_cover row id (the vote endpoints' cover id)
          format: int64
          type: integer
        image_hash:
          type: string
        kind:
          type: string
        portrait_pinned:
          description: true = the vertical portrait pin (portrait-first UI)
          type: boolean
        sexual:
          description: "content flag: 0=safe 1=suggestive 2=explicit"
          format: int32
          type: integer
        sort_order:
          description: gallery/pin position; 0 = pinned landscape banner
          format: int64
          type: integer
        source_id:
          description: "catalog_source id (provenance): galgame_wiki/vndb/bangumi/upscale for a bridged claimed cover, the backfill source for a bodyless cover"
          format: int32
          type: integer
        violence:
          description: "content flag: 0=safe 1=suggestive 2=explicit"
          format: int32
          type: integer
        vote_count:
          description: advisory best-cover votes on this cover; never reorders anything server-side
          format: int64
          type: integer
      required:
        - id
        - image_hash
        - kind
        - portrait_pinned
        - sort_order
        - sexual
        - violence
        - source_id
        - vote_count
      type: object
    WorkCreditsResponse:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/CreditGroup"
          type:
            - array
            - "null"
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - groups
      type: object
    WorkIntro:
      additionalProperties: false
      properties:
        intro:
          type: string
        lang:
          type: string
        machine:
          description: true if this intro is an LLM machine translation (no source text for this language); omitted for source/bridged rows
          type: boolean
        source_id:
          description: "catalog_source id (provenance): e.g. galgame_wiki for a bridged claimed work, vndb for a bodyless backfill"
          format: int32
          type: integer
      required:
        - lang
        - intro
        - source_id
      type: object
    WorkLabel:
      additionalProperties: false
      properties:
        display_name:
          type: string
        kind:
          description: "attribution nature: 0=circle 1=publisher 2=developer 3=brand"
          format: int32
          type: integer
        label_id:
          format: int64
          type: integer
        label_kind:
          description: the label's own kind (0=game_brand … 4=doujin_circle …)
          format: int32
          type: integer
      required:
        - label_id
        - display_name
        - label_kind
        - kind
      type: object
    WorkPlatform:
      additionalProperties: false
      properties:
        platform:
          description: catalog_platform registry code (win/and/ios/…)
          type: string
        source_id:
          description: catalog_source id that asserted it
          format: int32
          type: integer
      required:
        - platform
        - source_id
      type: object
    WorkPlaytime:
      additionalProperties: false
      properties:
        minutes:
          description: median playtime in minutes (unit-normalized; estimate semantics stay source-native)
          format: int64
          type: integer
        source_id:
          description: "catalog_source id (provenance): vndb = vote-backed median, erogamescape = community median"
          format: int32
          type: integer
        vote_count:
          description: user reports backing the estimate; 0 = the source publishes no per-work count
          format: int64
          type: integer
      required:
        - source_id
        - minutes
        - vote_count
      type: object
    WorkPopularity:
      additionalProperties: false
      properties:
        metric:
          description: "popularity metric: 0=downloads 1=wishlist 2=reviews (extensible vocabulary)"
          format: int32
          type: integer
        source_id:
          description: "catalog_source id (provenance + unit selector): counters are source-relative and never summed across sources"
          format: int32
          type: integer
        value:
          description: raw counter verbatim from the source; a published 0 is a real value, an unpublished counter has no element
          format: int64
          type: integer
      required:
        - source_id
        - metric
        - value
      type: object
    WorkRating:
      additionalProperties: false
      properties:
        distribution:
          description: "vote histogram on the source-native scale, ascending, sparse (an absent bucket has no votes); detail face only. All four sources publish it: bangumi 1-10, dlsite 1-5, vndb 1-10, erogamescape 0-100 in decile steps (0, 10, ... 100). The bars do not share one denominator: bangumi and dlsite publish the histogram together with the aggregate, so their bars sum to vote_count; erogamescape bars are computed from the reviews mirror, which syncs on a cursor independent of the row score and vote_count come from, so sum-of-bars is the histogram's own denominator and need not equal vote_count; vndb bars come from the public votes dump, which omits votes on private lists, so they sum to at most vote_count"
          items:
            $ref: "#/components/schemas/RatingBucket"
          type:
            - array
            - "null"
        rank:
          description: source-internal rank; absent when the source has no rank or the work is unranked
          format: int64
          type: integer
        score:
          description: rating on the source-native scale (never normalized across sources)
          format: double
          type: number
        source_id:
          description: "catalog_source id (provenance + scale selector): vndb = 1-10 bayesian-smoothed rating, bangumi = 0-10 mean, dlsite = 0-5 star mean, erogamescape = 0-100 median"
          format: int32
          type: integer
        stats:
          $ref: "#/components/schemas/RatingStats"
          description: spread of the same vote population as score; detail face only. Carried by erogamescape (average, stdev, min and max, on its 0-100 scale) and by vndb (average only — the plain mean beside the bayesian-smoothed rating that score holds). bangumi and dlsite carry no stats
        vote_count:
          description: number of ratings backing the score
          format: int64
          type: integer
      required:
        - source_id
        - score
        - vote_count
      type: object
    WorkRef:
      additionalProperties: false
      properties:
        external_id:
          type: string
        level:
          description: work | release
          type: string
        release_id:
          description: present when level=release
          format: int64
          type: integer
        source:
          type: string
      required:
        - source
        - external_id
        - level
      type: object
    WorkRelation:
      additionalProperties: false
      properties:
        content_rating:
          format: int32
          type: integer
        display_name:
          type: string
        medium_id:
          format: int32
          type: integer
        phrase:
          description: direction-resolved display phrase from this work's perspective
          type: string
        product_work_id:
          format: int64
          type: integer
        relation_type:
          description: vocabulary key, e.g. sequel_of / fandisc_of / remake_of / collects / shares_character
          type: string
        site:
          description: claim site when the other end is claimed
          type: string
        status:
          format: int32
          type: integer
        work_id:
          description: the other end's catalog work id
          format: int64
          type: integer
      required:
        - relation_type
        - phrase
        - work_id
        - display_name
        - medium_id
        - content_rating
        - status
      type: object
    WorkScreenshot:
      additionalProperties: false
      properties:
        caption:
          type: string
        image_hash:
          type: string
        sexual:
          description: "content flag: 0=safe 1=suggestive 2=explicit"
          format: int32
          type: integer
        sort_order:
          description: gallery position
          format: int64
          type: integer
        source_id:
          description: "catalog_source id (provenance): galgame_wiki/vndb for a bridged claimed screenshot, the backfill source for a bodyless screenshot"
          format: int32
          type: integer
        violence:
          description: "content flag: 0=safe 1=suggestive 2=explicit"
          format: int32
          type: integer
      required:
        - image_hash
        - caption
        - sort_order
        - sexual
        - violence
        - source_id
      type: object
    WorkSearchHit:
      additionalProperties: false
      properties:
        content_rating:
          description: 0=all_ages 1=sensitive 2=r18
          format: int32
          type: integer
        display_name:
          type: string
        dlsite_id:
          type: string
        medium_id:
          format: int32
          type: integer
        site:
          type: string
        status:
          description: 0=live 1=stub 2=merged
          format: int32
          type: integer
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - display_name
        - medium_id
        - content_rating
        - status
      type: object
    WorkSearchResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/WorkSearchHit"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    WorkSeries:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        member_count:
          description: total anchored works in this series
          format: int64
          type: integer
        name:
          description: series display name, verbatim from the source (dlsite series_name)
          type: string
        source_id:
          description: catalog_source id the series was materialized from
          format: int32
          type: integer
      required:
        - id
        - name
        - source_id
        - member_count
      type: object
    WorkSeriesSibling:
      additionalProperties: false
      properties:
        content_rating:
          format: int32
          type: integer
        display_name:
          type: string
        medium_id:
          format: int32
          type: integer
        product_work_id:
          format: int64
          type: integer
        site:
          type: string
        status:
          format: int32
          type: integer
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - display_name
        - medium_id
        - content_rating
        - status
      type: object
    WorkSubmitDate:
      additionalProperties: false
      properties:
        d:
          description: 0 = unknown day; requires m
          format: int32
          maximum: 31
          minimum: 0
          type: integer
        m:
          description: 0 = unknown month
          format: int32
          maximum: 12
          minimum: 0
          type: integer
        "y":
          format: int32
          maximum: 2200
          minimum: 1970
          type: integer
      required:
        - "y"
      type: object
    WorkSubmitResponse:
      additionalProperties: false
      properties:
        claim_state:
          description: Always pending — a submission is born awaiting review
          type: string
        event_id:
          description: The claim-event row recording the birth (from_state null → pending)
          format: int64
          type: integer
        product_work_id:
          format: int64
          type: integer
        release_id:
          description: The curated release row the submitted date produced; absent when no date was given
          format: int64
          type: integer
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - product_work_id
        - claim_state
        - event_id
      type: object
    WorkTag:
      additionalProperties: false
      properties:
        canonical_id:
          description: catalog_tag id when this (source_id, name) is mapped into the canonical vocabulary; absent otherwise
          format: int64
          type: integer
        count:
          description: source vote count backing the tag; absent when the source has no votes (bridged galgame wiki tags)
          format: int64
          type: integer
        kind:
          description: canonical kind (0=content 1=meta/platform-attribute); absent when unmapped
          format: int32
          type: integer
        name:
          description: tag text, verbatim from the source (no vocabulary mapping)
          type: string
        source_id:
          description: "catalog_source id (provenance): galgame_wiki/vndb for a bridged claimed tag, the backfill source (bangumi) for a bodyless tag"
          format: int32
          type: integer
        tier:
          description: canonical display tier (0=core 1=longtail 2=hidden); absent when unmapped
          format: int32
          type: integer
      required:
        - name
        - source_id
      type: object
    WorkTitle:
      additionalProperties: false
      properties:
        kind:
          description: 0=official 1=alias 2=abbreviation 3=search_hint
          format: int32
          type: integer
        lang:
          type: string
        latin:
          type: string
        machine:
          description: true if this title is an LLM machine translation (no source published one for this language); omitted for source rows
          type: boolean
        title:
          type: string
      required:
        - lang
        - title
        - kind
      type: object
    WorksCell:
      additionalProperties: false
      properties:
        claimed:
          type: boolean
        count:
          format: int64
          type: integer
        medium_id:
          format: int32
          type: integer
        status:
          description: 0=live 1=stub 2=merged
          format: int32
          type: integer
      required:
        - medium_id
        - claimed
        - status
        - count
      type: object
    WorksMatrix:
      additionalProperties: false
      properties:
        cells:
          items:
            $ref: "#/components/schemas/WorksCell"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - total
        - cells
      type: object
info:
  title: KUN Catalog Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/catalog/characters/{id}:
    get:
      operationId: getCatalogCharacterByID
      parameters:
        - description: Catalog character id
          in: path
          name: id
          required: true
          schema:
            description: Catalog character id
            format: int64
            type: integer
        - description: max trait spoiler level to include (0-2, default 0)
          explode: false
          in: query
          name: spoilers
          schema:
            description: max trait spoiler level to include (0-2, default 0)
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCharacterDetailResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Read a character's identity + aliases by catalog id
      tags:
        - catalog-s2s
  /api/v1/catalog/characters/{id}/works:
    get:
      operationId: getCatalogCharacterWorks
      parameters:
        - description: Catalog character id
          in: path
          name: id
          required: true
          schema:
            description: Catalog character id
            format: int64
            type: integer
        - description: Page size (capped at 50)
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Page size (capped at 50)
            format: int64
            type: integer
        - description: Rows to skip
          explode: false
          in: query
          name: offset
          schema:
            description: Rows to skip
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCharacterWorksResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Works a character appears in (roster edges ∪ voice credits) with kind + voice names
      tags:
        - catalog-s2s
  /api/v1/catalog/claim-events/feed:
    get:
      operationId: listCatalogClaimEvents
      parameters:
        - description: "Exclusive cursor: return events with a greater id (0 = from the beginning)"
          explode: false
          in: query
          name: since
          schema:
            description: "Exclusive cursor: return events with a greater id (0 = from the beginning)"
            format: int64
            type: integer
        - description: Page size (default 200, max 1000)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (default 200, max 1000)
            format: int64
            type: integer
        - description: Restrict to one claiming site
          explode: false
          in: query
          name: site
          schema:
            description: Restrict to one claiming site
            type: string
        - description: Restrict to transitions caused by this user (0 = every actor)
          explode: false
          in: query
          name: actor_uid
          schema:
            description: Restrict to transitions caused by this user (0 = every actor)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeClaimEventFeed"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Cursor feed of claim-state transitions (ascending id; the source for downstream inboxes and point awards)
      tags:
        - catalog-lifecycle
  /api/v1/catalog/edit-revisions/feed:
    get:
      operationId: listCatalogEditRevisions
      parameters:
        - description: "Exclusive cursor: return revisions with a greater id (0 = from the beginning)"
          explode: false
          in: query
          name: since
          schema:
            description: "Exclusive cursor: return revisions with a greater id (0 = from the beginning)"
            format: int64
            type: integer
        - description: Page size (default 200, max 1000)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (default 200, max 1000)
            format: int64
            type: integer
        - description: Restrict to one family, e.g. catalog
          explode: false
          in: query
          name: entity_family
          schema:
            description: Restrict to one family, e.g. catalog
            type: string
        - description: Restrict to one type, e.g. catalog.work
          explode: false
          in: query
          name: entity_type
          schema:
            description: Restrict to one type, e.g. catalog.work
            type: string
