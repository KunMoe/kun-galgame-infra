          in: path
          name: id
          required: true
          schema:
            description: Proposal id (must be one the token's user filed)
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEditProposalView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Withdraw one's OWN open proposal. Bodiless: the only identity involved is the token's, and the engine refuses any proposal the token's user did not file"
      tags:
        - catalog-user
  /api/v1/user/catalog/edit/revert:
    post:
      operationId: revertEditEntityUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEditRevertRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEditRevertResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Restore an entity to a historical revision AS THE BEARER TOKEN'S OWN USER (a new revision; history kept). The tenant whose overlay applies is the token client's, so the body carries no site
      tags:
        - catalog-user
  /api/v1/user/catalog/edit/schema/{entity_type}:
    get:
      operationId: getEditSchemaUser
