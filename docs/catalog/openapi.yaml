        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Field schema + THIS TOKEN's evaluated field-level capabilities. Same projection as the S2S op, with no actor query parameters at all: a caller cannot ask what some other user would be allowed to do"
      tags:
        - catalog-user
  /api/v1/user/catalog/edit/snapshot:
    get:
      operationId: getEditSnapshotUser
      parameters:
        - description: Registered entity type, e.g. catalog.work
