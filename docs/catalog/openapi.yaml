components:
  schemas:
    AnchorRef:
      additionalProperties: false
      properties:
        external_id:
          type: string
        link_kind:
          description: 0=exact 1=probable 2=related
          format: int32
          type: integer
        matched_by:
          type: string
        source:
          type: string
      required:
        - source
        - external_id
        - link_kind
      type: object
    AnchorTierCell:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        link_kind:
          description: 0=exact 1=probable 2=related
          format: int32
          type: integer
        source:
          type: string
      required:
        - source
        - link_kind
        - count
      type: object
    CatalogStats:
      additionalProperties: false
      properties:
        anchors_by_source_tier:
          items:
            $ref: "#/components/schemas/AnchorTierCell"
          type:
            - array
            - "null"
        attributions_by_kind:
          items:
            $ref: "#/components/schemas/KindCount"
          type:
            - array
            - "null"
        credits_by_source:
          items:
            $ref: "#/components/schemas/KeyCount"
          type:
            - array
            - "null"
        entities:
          $ref: "#/components/schemas/EntityCounts"
        llm_bid_verdicts:
          items:
            $ref: "#/components/schemas/KeyCount"
          type:
            - array
            - "null"
        queues:
          $ref: "#/components/schemas/QueueLevels"
        source_freshness:
          items:
            $ref: "#/components/schemas/SourceFreshness"
          type:
            - array
            - "null"
        works:
          $ref: "#/components/schemas/WorksMatrix"
      required:
        - works
        - entities
        - credits_by_source
        - attributions_by_kind
        - anchors_by_source_tier
        - queues
        - llm_bid_verdicts
        - source_freshness
      type: object
    CharacterAlias:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        is_primary_for_locale:
          type: boolean
        kind:
          description: 0=translation 1=spelling_variant 2=search_hint
          format: int32
          type: integer
        lang:
          type: string
        latin:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - lang
        - kind
        - is_primary_for_locale
      type: object
    CharacterDetailResponse:
      additionalProperties: false
      properties:
        aliases:
          items:
            $ref: "#/components/schemas/CharacterAlias"
          type:
            - array
            - "null"
        attr_sources:
          additionalProperties:
            type: string
          type: object
        birthday_day:
          format: int32
          type: integer
        birthday_month:
          format: int32
          type: integer
        blood_type:
          description: 1=A 2=B 3=AB 4=O; absent = unknown
          format: int32
          type: integer
        bust_cm:
          format: int32
          type: integer
        cup:
          type: string
        description:
          type: string
        display_name:
          type: string
        extra:
          additionalProperties: {}
          type: object
        figure_hash:
          type: string
        gender:
          format: int32
          type: integer
        height_cm:
          format: int32
          type: integer
        hip_cm:
          format: int32
          type: integer
        id:
          format: int64
          type: integer
        image_hash:
          type: string
        instance_of:
          format: int64
          type: integer
        intros:
          items:
            $ref: "#/components/schemas/WorkIntro"
          type:
            - array
            - "null"
        lang:
          type: string
        latin:
          type: string
        traits:
          items:
            $ref: "#/components/schemas/CharacterTrait"
          type:
            - array
            - "null"
        waist_cm:
          format: int32
          type: integer
        weight_kg:
          format: int32
          type: integer
      required:
        - id
        - display_name
        - lang
        - aliases
        - intros
        - traits
      type: object
    CharacterHead:
      additionalProperties: false
      properties:
        display_name:
          type: string
        id:
          format: int64
          type: integer
        lang:
          description: BCP-47 language of display_name; empty when unrecorded
          type: string
        latin:
          type: string
      required:
        - id
        - display_name
      type: object
    CharacterTrait:
      additionalProperties: false
      properties:
        group_name:
          description: root-group display name; absent for a root trait
          type: string
        group_name_zh:
          description: Simplified-Chinese root-group name; absent for a root trait or an unrendered group
          type: string
        group_tid:
          description: VNDB root-group tid (i1=Hair, i35=Eyes, …); empty when the trait is itself a root
          type: string
        id:
          format: int64
          type: integer
        lie:
          description: presented as true in-story but actually a lie (VNDB flag)
          type: boolean
        name:
          description: verbatim VNDB English trait name
          type: string
        name_zh:
          description: Simplified-Chinese trait name; absent when the vocabulary row has none yet
          type: string
        sexual:
          description: the trait belongs to a sexual trait family — consumers gate rendering themselves
          type: boolean
        spoiler_level:
          description: "per-character spoiler grade: 0 none / 1 minor / 2 major"
          format: int32
          type: integer
      required:
        - id
        - name
        - group_tid
        - spoiler_level
      type: object
    CharacterWorkRow:
      additionalProperties: false
      properties:
        identity:
          description: Opaque row identity for catalog.work.roster.suppressed on THIS work; echo it back, never rebuild it. Absent when the work is reached only through a voice credit
          type: string
        kind:
          description: "roster appearance strength: 0=unknown 1=main 2=secondary 3=appears (0 also when reached only via a voice credit)"
          format: int32
          type: integer
        spoiler:
          description: "roster appearance spoiler level: 0=none 1=minor 2=major (0 also when reached only via a voice credit)"
          format: int32
          type: integer
        voiced:
          description: true when a voice credit names this character on this work
          type: boolean
        voices:
          items:
            $ref: "#/components/schemas/VoiceName"
          type:
            - array
            - "null"
        work:
          $ref: "#/components/schemas/WorkBrief"
      required:
        - work
        - kind
        - spoiler
        - voiced
        - voices
      type: object
    CharacterWorksResponse:
      additionalProperties: false
      properties:
        character:
          $ref: "#/components/schemas/CharacterHead"
        items:
          items:
            $ref: "#/components/schemas/CharacterWorkRow"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - character
        - items
        - total
      type: object
    ClaimActionResult:
      additionalProperties: false
      properties:
        event_id:
          format: int64
          type: integer
        from_state:
          type:
            - string
            - "null"
        to_state:
          type: string
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - from_state
        - to_state
        - event_id
      type: object
    ClaimAnchor:
      additionalProperties: false
      properties:
        external_id:
          minLength: 1
          type: string
        level:
          description: Anchor grain; defaults to work
          enum:
            - work
            - release
          type: string
        source_id:
          description: catalog_source registry id (e.g. 2=vndb 3=bangumi 4=dlsite)
          format: int32
          type: integer
      required:
        - source_id
        - external_id
      type: object
    ClaimEventFeed:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ClaimEventFeedItem"
          type:
            - array
            - "null"
        next_since:
          format: int64
          type: integer
      required:
        - items
        - next_since
      type: object
    ClaimEventFeedItem:
      additionalProperties: false
      properties:
        actor_uid:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        from_state:
          type:
            - string
            - "null"
        id:
          format: int64
          type: integer
        product_work_id:
          description: The claim's CURRENT product-side id (a snapshot, not the value at event time)
          format: int64
          type:
            - integer
            - "null"
        reason:
          type:
            - string
            - "null"
        site:
          type: string
        to_state:
          type: string
        work_id:
          format: int64
          type: integer
      required:
        - id
        - work_id
        - from_state
        - to_state
        - actor_uid
        - reason
        - site
        - product_work_id
        - created_at
      type: object
    ClaimWorkRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ClaimWorkRequest.json
          format: uri
          readOnly: true
          type: string
        anchors:
          description: External identity anchors; matched exact refs claim the existing registry row
          items:
            $ref: "#/components/schemas/ClaimAnchor"
          maxItems: 16
          type:
            - array
            - "null"
        content_rating:
          description: 0=all_ages 1=sensitive 2=r18
          format: int32
          maximum: 2
          minimum: 0
          type: integer
        display_name:
          minLength: 1
          type: string
        medium_id:
          description: catalog_medium registry id (1=galgame ...)
          format: int32
          type: integer
        olang:
          description: Original language (BCP-47); defaults to ja
          type: string
        product_work_id:
          description: The work's id inside the product database
          format: int64
          type: integer
        site:
          description: Claiming site key (e.g. galgame_wiki)
          minLength: 1
          type: string
      required:
        - medium_id
        - site
        - product_work_id
        - display_name
      type: object
    ClaimWorkResponse:
      additionalProperties: false
      properties:
        created:
          description: true when a new registry row was minted (no anchor matched)
          type: boolean
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - created
      type: object
    CoverVoteResponse:
      additionalProperties: false
      properties:
        cover_id:
          format: int64
          type: integer
        vote_count:
          description: the cover's advisory vote total after this write
          format: int64
          type: integer
        voted:
          description: the acting user's resulting state on this cover
          type: boolean
      required:
        - cover_id
        - vote_count
        - voted
      type: object
    CreditGroup:
      additionalProperties: false
      properties:
        credits:
          items:
            $ref: "#/components/schemas/CreditItem"
          type:
            - array
            - "null"
        role_id:
          format: int64
          type: integer
        role_key:
          type: string
        role_name:
          type: string
      required:
        - role_id
        - role_key
        - role_name
        - credits
      type: object
    CreditItem:
      additionalProperties: false
      properties:
        character:
          type: string
        character_id:
          format: int64
          type: integer
        credit_name_id:
          format: int64
          type: integer
        identity:
          description: Opaque row identity for catalog.work.credits.suppressed; echo it back, never rebuild it
          type: string
        lang:
          type: string
        latin:
          type: string
        name:
          type: string
        note:
          type: string
        source:
          type: string
      required:
        - credit_name_id
        - name
        - lang
        - identity
      type: object
    CursorPageUserClaimItem:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/UserClaimItem"
          type:
            - array
            - "null"
        next_before:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - items
        - next_before
        - total
      type: object
    EditAmendmentView:
      additionalProperties: false
      properties:
        amender_uid:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        note:
          type: string
        seq:
          format: int64
          type: integer
        set:
          additionalProperties: {}
          type: object
        unset:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - seq
        - amender_uid
        - note
        - created_at
      type: object
    EditDiffResponse:
      additionalProperties: false
      properties:
        fields:
          items:
            $ref: "#/components/schemas/EditFieldDiffView"
          type:
            - array
            - "null"
        from_seq:
          format: int64
          type: integer
        to_seq:
          format: int64
          type: integer
      required:
        - from_seq
        - to_seq
        - fields
      type: object
    EditFieldDiffView:
      additionalProperties: false
      properties:
        diff_hint:
          type: string
        from: {}
        key:
          type: string
        kind:
          type: string
        to: {}
      required:
        - key
        - from
        - to
      type: object
    EditProposalCreateResponse:
      additionalProperties: false
      properties:
        merged:
          description: true when the direct-edit sugar landed the patch immediately
          type: boolean
        proposal:
          $ref: "#/components/schemas/EditProposalView"
        revision:
          $ref: "#/components/schemas/EditRevisionView"
          description: The produced revision when merged
      required:
        - proposal
        - merged
      type: object
    EditProposalListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/EditProposalView"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    EditProposalView:
      additionalProperties: false
      properties:
        amendments:
          description: Seq-ordered (detail endpoint only)
          items:
            $ref: "#/components/schemas/EditAmendmentView"
          type:
            - array
            - "null"
        base_revision_seq:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        decided_at:
          format: date-time
          type: string
        decided_by_uid:
          format: int64
          type: integer
        decision_note:
          type: string
        effective_patch:
          additionalProperties: {}
          description: patch ⊕ amendments (detail endpoint only)
          type: object
        entity_family:
          type: string
        entity_id:
          format: int64
          type: integer
        entity_type:
          type: string
        id:
          format: int64
          type: integer
        note:
          type: string
        patch:
          additionalProperties: {}
          type: object
        proposer_uid:
          format: int64
          type: integer
        site:
          type: string
        status:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - entity_family
        - entity_type
        - entity_id
        - base_revision_seq
        - patch
        - proposer_uid
        - note
        - site
        - status
        - created_at
        - updated_at
      type: object
    EditRevertResponse:
      additionalProperties: false
      properties:
        proposal:
          $ref: "#/components/schemas/EditProposalView"
        revision:
          $ref: "#/components/schemas/EditRevisionView"
      required:
        - proposal
        - revision
      type: object
    EditRevisionFeed:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/EditRevisionFeedItem"
          type:
            - array
            - "null"
        next_since:
          format: int64
          type: integer
      required:
        - items
        - next_since
      type: object
    EditRevisionFeedItem:
      additionalProperties: false
      properties:
        action:
          description: 0=created 1=merged 2=direct 3=reverted
          format: int32
          type: integer
        actor_uid:
          format: int64
          type: integer
        amender_uid:
          format: int64
          type:
            - integer
            - "null"
        changed_fields:
          items:
            type: string
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        entity_family:
          type: string
        entity_id:
          format: int64
          type: integer
        entity_type:
          type: string
        id:
          format: int64
          type: integer
        product_work_id:
          format: int64
          type:
            - integer
            - "null"
        proposal_id:
          format: int64
          type:
            - integer
            - "null"
        seq:
          format: int64
          type: integer
        site:
          type: string
      required:
        - id
        - entity_family
        - entity_type
        - entity_id
        - seq
        - action
        - changed_fields
        - actor_uid
        - amender_uid
        - proposal_id
        - site
        - created_at
        - product_work_id
      type: object
    EditRevisionListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/EditRevisionView"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    EditRevisionView:
      additionalProperties: false
      properties:
        action:
          type: string
        actor_uid:
          format: int64
          type: integer
        amender_uid:
          format: int64
          type: integer
        changed_fields:
          items:
            type: string
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        entity_family:
          type: string
        entity_id:
          format: int64
          type: integer
        entity_type:
          type: string
        id:
          format: int64
          type: integer
        legacy_action:
          description: Original pre-engine action word (migrated rows only)
          type: string
        legacy_id:
          description: Source pre-engine revision row id (migrated rows only)
          format: int64
          type: integer
        legacy_minor:
          description: Old-wire minor-edit flag (migrated rows only)
          type: boolean
        legacy_note:
          description: Old-wire revision note (migrated rows only)
          type: string
        proposal_id:
          format: int64
          type: integer
        seq:
          format: int64
          type: integer
        site:
          type: string
        snapshot:
          additionalProperties: {}
          type: object
      required:
        - id
        - entity_family
        - entity_type
        - entity_id
        - seq
        - action
        - changed_fields
        - snapshot
        - actor_uid
        - site
        - created_at
      type: object
    EditSchemaFieldView:
      additionalProperties: false
      properties:
        can_propose:
          type: boolean
        can_review:
          type: boolean
        deprecated:
          type: boolean
        diff_hint:
          type: string
        key:
          type: string
        kind:
          type: string
        locked:
          type: boolean
        max_elements:
          description: Cap on this list field's element count; absent for scalar fields
          format: int64
          type: integer
        max_suppressed:
          description: Cap on this field's suppression set; absent when the field has none
          format: int64
          type: integer
        would_automerge:
          description: A proposal by this caller would merge instantly
          type: boolean
      required:
        - key
        - kind
        - diff_hint
        - locked
        - can_propose
        - can_review
        - would_automerge
      type: object
    EditSchemaResponse:
      additionalProperties: false
      properties:
        entity_type:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/EditSchemaFieldView"
          type:
            - array
            - "null"
      required:
        - entity_type
        - fields
      type: object
    EditSnapshotResponse:
      additionalProperties: false
      properties:
        entity_id:
          format: int64
          type: integer
        entity_type:
          type: string
        values:
          additionalProperties: {}
          type: object
      required:
        - entity_type
        - entity_id
        - values
      type: object
    EntityCounts:
      additionalProperties: false
      properties:
        characters:
          format: int64
          type: integer
        credit_names:
          format: int64
          type: integer
        labels:
          format: int64
          type: integer
        orphan_credit_names:
          description: credit_name.person_id IS NULL
          format: int64
          type: integer
        persons:
          format: int64
          type: integer
      required:
        - persons
        - credit_names
        - orphan_credit_names
        - labels
        - characters
      type: object
    EntitySearchHit:
      additionalProperties: false
      properties:
        content_rating:
          description: "works only (wave 105): 0=all_ages 1=sensitive 2=r18"
          format: int32
          type: integer
        entity_type:
          type: string
        id:
          description: "prefixed: n{id} / c{id} / b{id}"
          type: string
        kind:
          description: label kind (labels only)
          format: int32
          type: integer
        latin:
          type: string
        logo_hash:
          description: "labels only: brand logo content hash in the image service; absent = none"
          type: string
        name:
          type: string
        person_id:
          description: credit-name → person link (names only; absent = orphan)
          format: int64
          type: integer
        popularity:
          format: double
          type: number
        sources:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - entity_type
        - name
        - sources
        - popularity
      type: object
    EntitySearchResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/EntitySearchHit"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    EnvelopeCatalogStats:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeCatalogStats.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/CatalogStats"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeCharacterDetailResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeCharacterDetailResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/CharacterDetailResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeCharacterWorksResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeCharacterWorksResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/CharacterWorksResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeClaimActionResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeClaimActionResult.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ClaimActionResult"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeClaimEventFeed:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeClaimEventFeed.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ClaimEventFeed"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeClaimWorkResponse:
