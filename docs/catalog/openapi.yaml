          in: path
          name: entity_type
          required: true
          schema:
            description: Registered entity type, e.g. catalog.work
            type: string
        - description: Entity-aware projection subject (0 = type-level projection)
          explode: false
          in: query
          name: entity_id
          schema:
            description: Entity-aware projection subject (0 = type-level projection)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEditSchemaResponse"
