      summary: "This work's covers with their advisory best-cover tallies, each carrying whether the BEARER TOKEN'S OWN USER voted for it. There is no uid parameter: the viewer is the token. Cross-site open like every catalog read — the tenant fence is a write-side rule"
      tags:
        - catalog-user
  /api/v1/user/catalog/works/{workID}/covers/{coverID}/vote:
    delete:
      operationId: unvoteCatalogWorkCoverUser
      parameters:
        - description: Catalog work id
          in: path
          name: workID
          required: true
          schema:
            description: Catalog work id
            format: int64
            minimum: 1
            type: integer
        - description: catalog_work_cover row id, as returned by the work detail's covers[].id
          in: path
          name: coverID
          required: true
          schema:
            description: catalog_work_cover row id, as returned by the work detail's covers[].id
            format: int64
            minimum: 1
            type: integer
      responses:
