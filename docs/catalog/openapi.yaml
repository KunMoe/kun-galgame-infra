  /api/v1/user/catalog/works/submit:
    post:
      operationId: submitCatalogWorkUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWorkSubmitRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWorkSubmitResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Submit a work for review AS THE BEARER TOKEN'S OWN USER: mints it in the pending claim state (registry row + content + birth event, one transaction) and stamps the submitter as its owner. The submitting tenant is the token client's catalog site and the submitter is the token's user; the body names neither. product_work_id is OPTIONAL — omit it and the registry issues the identity, the claim adopting the minted work id (returned as product_work_id). IDEMPOTENCY is the S2S op's: with product_work_id a repeat is a 409 echoing the existing work (matched_by=claim); without it a repeat is recognized only by the identity anchors the payload's links assert (matched_by=anchor), and a submission carrying neither WILL mint a second work if retried"
      tags:
        - catalog-user
  /api/v1/user/catalog/works/{id}:
    get:
      operationId: getCatalogWorkByIDUser
      parameters:
        - description: Catalog work id
          in: path
          name: id
          required: true
          schema:
            description: Catalog work id
            format: int64
            minimum: 1
            type: integer
        - description: true = also return editor-hidden releases (deleted_at set) and flag them hidden=true; false/absent = live releases only, same payload as S2S
          explode: false
          in: query
          name: include_hidden
          schema:
            description: true = also return editor-hidden releases (deleted_at set) and flag them hidden=true; false/absent = live releases only, same payload as S2S
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWorkByAnchorResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Read a work by catalog id (same bundle as the S2S work-detail). Pass include_hidden=true to list editor-hidden releases so they can be unhidden
      tags:
        - catalog-user
  /api/v1/user/catalog/works/{id}/claim-actions/{action}:
    post:
      operationId: actOnCatalogClaimUser
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
        - description: claim | submit | publish | withdraw | approve | decline | ban | unban
          in: path
          name: action
          required: true
          schema:
            description: claim | submit | publish | withdraw | approve | decline | ban | unban
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserClaimActionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeClaimActionResult"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "Move a claim through its lifecycle AS THE BEARER TOKEN'S OWN USER: claim / submit / publish / withdraw (the token's user must be the entry's owner — or its FIRST CLAIMANT when the entry is unowned, in which case the action adopts it: this is how a person claims one of the machine-imported drafts) or approve / decline / ban / unban (the token's roles must carry catalog.claim.review). 409 on an illegal transition, echoing the current state; 403 on ANOTHER user's claim or another tenant's"
      tags:
        - catalog-user
  /api/v1/user/catalog/works/{id}/covers:
    get:
      operationId: listCatalogWorkCoversUser
      parameters:
        - description: Catalog work id
          in: path
          name: id
          required: true
          schema:
            description: Catalog work id
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
