            $ref: "#/components/schemas/WorkPlaytime"
          type:
            - array
            - "null"
        popularity:
          items:
            $ref: "#/components/schemas/WorkPopularity"
          type:
            - array
            - "null"
        ratings:
          items:
            $ref: "#/components/schemas/WorkRating"
          type:
            - array
            - "null"
        refs:
          items:
            $ref: "#/components/schemas/WorkRef"
          type:
            - array
            - "null"
        relations:
          items:
            $ref: "#/components/schemas/WorkRelation"
          type:
            - array
            - "null"
        releases:
          items:
            $ref: "#/components/schemas/ReleaseBrief"
          type:
            - array
            - "null"
        screenshots:
          items:
            $ref: "#/components/schemas/WorkScreenshot"
          type:
            - array
            - "null"
        series:
          items:
            $ref: "#/components/schemas/WorkSeries"
          type:
            - array
            - "null"
        series_siblings:
          items:
            $ref: "#/components/schemas/WorkSeriesSibling"
          type:
            - array
            - "null"
        tags:
          items:
            $ref: "#/components/schemas/WorkTag"
          type:
            - array
            - "null"
        titles:
          items:
            $ref: "#/components/schemas/WorkTitle"
          type:
            - array
            - "null"
        work:
          $ref: "#/components/schemas/WorkCore"
      required:
