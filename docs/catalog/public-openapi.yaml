            type: string
        - description: "Comma-separated CLOSED vocabulary: sfw,nsfw — the EDITORIAL DISPLAY axis on the parent work (the values claimed_by.content_limit renders), gating FEED MEMBERSHIP and the count alike. An unknown token is a 400 (a CLOSED vocabulary, unlike olang / lang / platform above). Absent = no gate (both values). NOT content_rating: that is the AGE axis (what the GAME is rated), this is whether the material you would RENDER is safe to publish. It rides in the ETag population key, so an sfw-gated and an ungated caller never share a validator"
          explode: false
          in: query
          name: content_limit
          schema:
            description: "Comma-separated CLOSED vocabulary: sfw,nsfw — the EDITORIAL DISPLAY axis on the parent work (the values claimed_by.content_limit renders), gating FEED MEMBERSHIP and the count alike. An unknown token is a 400 (a CLOSED vocabulary, unlike olang / lang / platform above). Absent = no gate (both values). NOT content_rating: that is the AGE axis (what the GAME is rated), this is whether the material you would RENDER is safe to publish. It rides in the ETag population key, so an sfw-gated and an ungated caller never share a validator"
            type: string
        - description: Opaque keyset cursor from a prior next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior next_cursor; omit for the first page
            type: string
        - description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
            format: int64
            type: integer
        - description: true/1 = include releases of r18 works (default false = dropped)
          explode: false
          in: query
          name: nsfw
          schema:
            description: true/1 = include releases of r18 works (default false = dropped)
            type: boolean
        - description: "Comma-separated rich-brief blocks: names,intros,labels,ratings,covers,refs — the works-list vocabulary verbatim, applied to each item's attached work block (unknown tokens ignored). The RELEASE's own refs[] are always present and are not affected by this parameter"
          explode: false
