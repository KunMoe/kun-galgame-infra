        - label_kind
        - kind
        - kinds
        - work_count
        - logo_hash
      type: object
    PublicWorkLink:
      additionalProperties: false
      properties:
        source:
          type: string
        url:
          type: string
      required:
        - source
        - url
      type: object
    PublicWorkLinksData:
      additionalProperties: false
      properties:
        items:
          description: Non-identity outbound links of this work, same order and shape as works/{id}.links[]. Sources whose storefront URL cannot be reconstructed from the stored code (dlsite, dmm) are absent by design — they stay reachable as anchors through refs[]
          items:
            $ref: "#/components/schemas/PublicWorkLink"
          type:
            - array
            - "null"
        next_offset:
          description: Pass back as offset= for the next page; absent on the last page
          format: int64
          type: integer
      required:
        - items
      type: object
    PublicWorkListItem:
      additionalProperties: false
      properties:
        claimed_by:
          $ref: "#/components/schemas/PublicClaimedBy"
        content_rating:
          type: string
        cover:
          type: string
        covers:
          $ref: "#/components/schemas/PublicWorkCoverSlots"
        display_name:
          type: string
        id:
          format: int64
          type: integer
        intros:
          description: "include=intros only: one intro per language, same shape and election as the work-detail intros block"
          items:
            $ref: "#/components/schemas/PublicIntro"
          type:
            - array
            - "null"
        labels:
          items:
            $ref: "#/components/schemas/PublicWorkLabel"
          type:
            - array
            - "null"
        latin:
          description: "include=names only: romanisation of display_name, from the title row display_name was taken from"
          type: string
        localized:
          additionalProperties:
            $ref: "#/components/schemas/PublicLocalizedName"
          description: include=names only, and absent (never {}) when this work has no localized title — the block is include-gated exactly like names, so its absence means "not requested or none", not "none". SPARSE by design — render localized[yourLocale] ?? display_name ?? latin
          type: object
        medium:
          type: string
        olang:
          type: string
        ratings:
          items:
            $ref: "#/components/schemas/PublicRating"
          type:
            - array
            - "null"
        refs:
          items:
            $ref: "#/components/schemas/PublicCatalogRef"
          type:
            - array
            - "null"
        release_date:
          type:
            - string
            - "null"
        updated:
          type: string
        via_label:
          $ref: "#/components/schemas/PublicLabelVia"
      required:
        - id
        - medium
        - display_name
        - content_rating
        - olang
        - release_date
        - claimed_by
        - updated
      type: object
    PublicWorkRatingsData:
      additionalProperties: false
      properties:
        items:
          description: Per-source ratings, same order and shape as works/{id}.ratings[] — distribution and stats included, because this IS the work-detail projection of that block
          items:
            $ref: "#/components/schemas/PublicRating"
          type:
            - array
            - "null"
        next_offset:
          description: Pass back as offset= for the next page; absent on the last page
          format: int64
          type: integer
      required:
        - items
      type: object
    PublicWorkRelationsData:
      additionalProperties: false
      properties:
        items:
          description: Related works, same order and shape as works/{id}.relations[] under include=relations — one edge rendered per direction. With nsfw absent or 0 an r18 relation end is dropped whole rather than emptied
          items:
            $ref: "#/components/schemas/PublicRelation"
          type:
            - array
            - "null"
        next_offset:
          description: Pass back as offset= for the next page, counted AFTER the r18 ends were dropped; absent on the last page
          format: int64
          type: integer
      required:
        - items
      type: object
    PublicWorkReleasesData:
      additionalProperties: false
      properties:
        items:
          description: Release rows of this work, same order (id ASC) and shape as works/{id}.releases[], each with its exact refs[] and its own labels[]
          items:
            $ref: "#/components/schemas/PublicRelease"
          type:
            - array
            - "null"
        next_offset:
          description: Pass back as offset= for the next page; absent on the last page
          format: int64
          type: integer
      required:
        - items
      type: object
    PublicWorkScreenshotsData:
      additionalProperties: false
      properties:
        items:
          description: Screenshots of this work, same order and shape as works/{id}.screenshots[]. Rows with no renderable bytes are dropped before paging
          items:
            $ref: "#/components/schemas/PublicScreenshot"
          type:
            - array
            - "null"
        next_offset:
          description: Pass back as offset= for the next page; absent on the last page
          format: int64
          type: integer
      required:
        - items
      type: object
    PublicWorkSeriesData:
      additionalProperties: false
      properties:
        items:
          description: Series this work belongs to, same order and shape as works/{id}.series[]; member_count is the series' full membership, not this page
          items:
            $ref: "#/components/schemas/PublicSeries"
          type:
            - array
            - "null"
        next_offset:
          description: Pass back as offset= for the next page; absent on the last page
          format: int64
          type: integer
      required:
        - items
      type: object
    PublicWorkTagsData:
      additionalProperties: false
      properties:
        items:
          description: Source tags carried by this work, same order and shape as works/{id}.tags[] (count DESC, name, source). work_count is the nsfw-aware population of works?tag_id=<canonical_id>, resolved for THIS page only
          items:
            $ref: "#/components/schemas/PublicTag"
          type:
            - array
            - "null"
        next_offset:
          description: Pass back as offset= for the next page; absent on the last page
          format: int64
          type: integer
      required:
        - items
      type: object
    PublicWorksListData:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PublicWorkListItem"
          type:
            - array
            - "null"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    PublicWorksSearchData:
      additionalProperties: false
      properties:
        facets:
          additionalProperties:
            additionalProperties:
              format: int64
              type: integer
            type: object
          type: object
        items:
          items:
            $ref: "#/components/schemas/PublicWorkListItem"
          type:
            - array
            - "null"
        limit:
          format: int64
          type: integer
        page:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - total
        - page
        - limit
        - items
      type: object
    RatingBucket:
      additionalProperties: false
      properties:
        count:
          description: votes cast at this value
          format: int64
          type: integer
        score:
          description: bucket value on the source-native scale
          format: int64
          type: integer
      required:
        - score
        - count
      type: object
    RatingStats:
      additionalProperties: false
      properties:
        average:
          description: mean on the source-native scale (score itself is the median for erogamescape)
          format: double
          type: number
        max:
          format: double
          type: number
        min:
          format: double
          type: number
        stdev:
          format: double
          type: number
      type: object
info:
  title: NextMoe Open API — Catalog
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/catalog/calendar:
    get:
      description: "Works whose EARLIEST year-carrying, non-deleted release falls inside the month — day precision and month precision alike (a month-precision work sorts at the head of its month, it is never pinned to the 1st). Same classification anchor as the works-list release_date, so a row's bucket and its printed date can never disagree. Year-precision works live in /v1/catalog/calendar/pending, undated ones in /v1/catalog/calendar/tba, and a work with no release row at all is in no bucket. Items are works-list rows verbatim, include= and all. Carries a bucket-level ETag (count + newest updated_at over the whole filtered set): an If-None-Match hit 304s before any page is loaded."
      operationId: listCatalogCalendarPublic
      parameters:
        - description: ISO month YYYY-MM; default = the CURRENT Asia/Tokyo month, echoed back in the response. A malformed value is a 400
          explode: false
          in: query
          name: month
          schema:
            description: ISO month YYYY-MM; default = the CURRENT Asia/Tokyo month, echoed back in the response. A malformed value is a 400
            type: string
        - description: "Original-language gate: comma-separated olang values in the upstream BCP-47 spelling (ja, zh-Hans, en, …) or 'all' to switch it off. Default = the ja + zh* family. olang is an OPEN vocabulary, so an unrecognized value yields an empty bucket, never a 400"
          explode: false
          in: query
          name: olang
          schema:
            description: "Original-language gate: comma-separated olang values in the upstream BCP-47 spelling (ja, zh-Hans, en, …) or 'all' to switch it off. Default = the ja + zh* family. olang is an OPEN vocabulary, so an unrecognized value yields an empty bucket, never a 400"
            type: string
        - description: "Comma-separated CLOSED vocabulary: sfw,nsfw — the EDITORIAL DISPLAY axis (the values claimed_by.content_limit renders), gating BUCKET MEMBERSHIP, the count and the meta frame alike. An unknown token is a 400 (a CLOSED vocabulary, unlike olang above). Absent = no gate (both values), byte-identical to the pre-A2-R5 bucket. NOT content_rating: that is the AGE axis (what the GAME is rated), this is whether the material you would RENDER is safe to publish. It rides in the ETag population key, so an sfw-gated and an ungated caller never share a validator"
          explode: false
          in: query
          name: content_limit
          schema:
            description: "Comma-separated CLOSED vocabulary: sfw,nsfw — the EDITORIAL DISPLAY axis (the values claimed_by.content_limit renders), gating BUCKET MEMBERSHIP, the count and the meta frame alike. An unknown token is a 400 (a CLOSED vocabulary, unlike olang above). Absent = no gate (both values), byte-identical to the pre-A2-R5 bucket. NOT content_rating: that is the AGE axis (what the GAME is rated), this is whether the material you would RENDER is safe to publish. It rides in the ETag population key, so an sfw-gated and an ungated caller never share a validator"
            type: string
        - description: Opaque keyset cursor from a prior next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior next_cursor; omit for the first page
            type: string
        - description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
            format: int64
            type: integer
        - description: true/1 = include r18 works (default false = dropped)
          explode: false
          in: query
          name: nsfw
          schema:
            description: true/1 = include r18 works (default false = dropped)
            type: boolean
        - description: "Comma-separated rich-brief blocks: names,intros,labels,ratings,covers,refs — the works-list vocabulary verbatim (unknown tokens ignored)"
          explode: false
          in: query
          name: include
          schema:
            description: "Comma-separated rich-brief blocks: names,intros,labels,ratings,covers,refs — the works-list vocabulary verbatim (unknown tokens ignored)"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicCalendarData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Release calendar, one ISO month (date ASC keyset); default = the current Asia/Tokyo month
      tags:
        - catalog-public
  /v1/catalog/calendar/pending:
    get:
      description: Works whose earliest release is known only to the YEAR — they appear in no month view of that year, by design. Same population, item shape, olang gate and ETag mechanics as the month bucket.
      operationId: listCatalogCalendarPendingPublic
      parameters:
        - description: YYYY; default = the CURRENT Asia/Tokyo year, echoed back in the response. A malformed value is a 400
          explode: false
          in: query
          name: year
          schema:
            description: YYYY; default = the CURRENT Asia/Tokyo year, echoed back in the response. A malformed value is a 400
            type: string
        - description: "Original-language gate: comma-separated olang values in the upstream BCP-47 spelling (ja, zh-Hans, en, …) or 'all' to switch it off. Default = the ja + zh* family. olang is an OPEN vocabulary, so an unrecognized value yields an empty bucket, never a 400"
          explode: false
          in: query
          name: olang
          schema:
            description: "Original-language gate: comma-separated olang values in the upstream BCP-47 spelling (ja, zh-Hans, en, …) or 'all' to switch it off. Default = the ja + zh* family. olang is an OPEN vocabulary, so an unrecognized value yields an empty bucket, never a 400"
            type: string
        - description: "Comma-separated CLOSED vocabulary: sfw,nsfw — the EDITORIAL DISPLAY axis (the values claimed_by.content_limit renders), gating BUCKET MEMBERSHIP, the count and the meta frame alike. An unknown token is a 400 (a CLOSED vocabulary, unlike olang above). Absent = no gate (both values), byte-identical to the pre-A2-R5 bucket. NOT content_rating: that is the AGE axis (what the GAME is rated), this is whether the material you would RENDER is safe to publish. It rides in the ETag population key, so an sfw-gated and an ungated caller never share a validator"
          explode: false
          in: query
          name: content_limit
          schema:
            description: "Comma-separated CLOSED vocabulary: sfw,nsfw — the EDITORIAL DISPLAY axis (the values claimed_by.content_limit renders), gating BUCKET MEMBERSHIP, the count and the meta frame alike. An unknown token is a 400 (a CLOSED vocabulary, unlike olang above). Absent = no gate (both values), byte-identical to the pre-A2-R5 bucket. NOT content_rating: that is the AGE axis (what the GAME is rated), this is whether the material you would RENDER is safe to publish. It rides in the ETag population key, so an sfw-gated and an ungated caller never share a validator"
            type: string
        - description: Opaque keyset cursor from a prior next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior next_cursor; omit for the first page
            type: string
        - description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
            format: int64
            type: integer
        - description: true/1 = include r18 works (default false = dropped)
          explode: false
          in: query
          name: nsfw
          schema:
            description: true/1 = include r18 works (default false = dropped)
            type: boolean
        - description: "Comma-separated rich-brief blocks: names,intros,labels,ratings,covers,refs — the works-list vocabulary verbatim (unknown tokens ignored)"
          explode: false
          in: query
          name: include
          schema:
            description: "Comma-separated rich-brief blocks: names,intros,labels,ratings,covers,refs — the works-list vocabulary verbatim (unknown tokens ignored)"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicCalendarData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Release calendar, one year's month-still-unknown bucket (id ASC keyset); default = the current Asia/Tokyo year
      tags:
        - catalog-public
  /v1/catalog/calendar/tba:
    get:
      description: Works that HAVE release rows but none carrying a year. A work with no release row at all is 'unknown' and deliberately enters no bucket — absence of a release is absence of an announcement, not a TBA date.
      operationId: listCatalogCalendarTBAPublic
      parameters:
        - description: "Original-language gate: comma-separated olang values in the upstream BCP-47 spelling (ja, zh-Hans, en, …) or 'all' to switch it off. Default = the ja + zh* family. olang is an OPEN vocabulary, so an unrecognized value yields an empty bucket, never a 400"
          explode: false
          in: query
          name: olang
          schema:
            description: "Original-language gate: comma-separated olang values in the upstream BCP-47 spelling (ja, zh-Hans, en, …) or 'all' to switch it off. Default = the ja + zh* family. olang is an OPEN vocabulary, so an unrecognized value yields an empty bucket, never a 400"
            type: string
        - description: "Comma-separated CLOSED vocabulary: sfw,nsfw — the EDITORIAL DISPLAY axis (the values claimed_by.content_limit renders), gating BUCKET MEMBERSHIP, the count and the meta frame alike. An unknown token is a 400 (a CLOSED vocabulary, unlike olang above). Absent = no gate (both values), byte-identical to the pre-A2-R5 bucket. NOT content_rating: that is the AGE axis (what the GAME is rated), this is whether the material you would RENDER is safe to publish. It rides in the ETag population key, so an sfw-gated and an ungated caller never share a validator"
          explode: false
          in: query
          name: content_limit
          schema:
            description: "Comma-separated CLOSED vocabulary: sfw,nsfw — the EDITORIAL DISPLAY axis (the values claimed_by.content_limit renders), gating BUCKET MEMBERSHIP, the count and the meta frame alike. An unknown token is a 400 (a CLOSED vocabulary, unlike olang above). Absent = no gate (both values), byte-identical to the pre-A2-R5 bucket. NOT content_rating: that is the AGE axis (what the GAME is rated), this is whether the material you would RENDER is safe to publish. It rides in the ETag population key, so an sfw-gated and an ungated caller never share a validator"
            type: string
        - description: Opaque keyset cursor from a prior next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior next_cursor; omit for the first page
            type: string
        - description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
            format: int64
            type: integer
        - description: true/1 = include r18 works (default false = dropped)
          explode: false
          in: query
          name: nsfw
          schema:
            description: true/1 = include r18 works (default false = dropped)
            type: boolean
        - description: "Comma-separated rich-brief blocks: names,intros,labels,ratings,covers,refs — the works-list vocabulary verbatim (unknown tokens ignored)"
          explode: false
          in: query
          name: include
          schema:
            description: "Comma-separated rich-brief blocks: names,intros,labels,ratings,covers,refs — the works-list vocabulary verbatim (unknown tokens ignored)"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicCalendarData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Release calendar, the global announced-but-undated bucket (id ASC keyset)
      tags:
        - catalog-public
  /v1/catalog/changes:
    get:
      description: "Creations and updates of LIVE galgame works, ordered by (updated_at, id) ASC. The feed deliberately trails real time by ~5 seconds: updated_at is statement time, not commit time, so serving rows younger than that lag would let a slow transaction commit behind an already-advanced consumer cursor and be skipped forever. DELETIONS DO NOT FLOW THROUGH THIS FEED — a row that leaves the LIVE set simply stops appearing; merge-style disappearances are covered by /v1/catalog/redirects, and mirror-style consumers should periodically reconcile the full id set via works?sort=id. WATERMARK GUARANTEE: any write that changes what a work's public face renders — its own columns and every works?include= block (names, intros, labels, ratings, covers, refs) plus release_date — moves that work's updated_at, so a full mirror can be driven from this feed alone. The guarantee covers sub-resource and fan-out writes (a cover detached, a label logo cleared, an anchor confirmed or killed, a release edited, a merge rehanging facets onto the survivor), and it is one-directional: updated_at moving does not promise the rendered bytes differ, so consumers must diff, not trust."
      operationId: listCatalogChangesPublic
      parameters:
        - description: "v1 feed scope: work (default)"
          explode: false
          in: query
          name: entity_type
          schema:
            description: "v1 feed scope: work (default)"
            enum:
              - work
            type: string
        - description: Opaque keyset cursor; omit to start from the beginning
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor; omit to start from the beginning
            type: string
        - description: Items per page 1-500 (default 100); above 500 is clamped to 500, a non-positive or non-numeric value is a 400
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-500 (default 100); above 500 is clamped to 500, a non-positive or non-numeric value is a 400
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicChangesData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Incremental works changes feed ((updated,id) keyset; next_cursor always present — keep polling it for new rows)
      tags:
        - catalog-public
  /v1/catalog/characters/{id}:
    get:
      operationId: getCatalogCharacterPublic
      parameters:
        - description: Catalog character id
          in: path
          name: id
          required: true
          schema:
            description: Catalog character id
            format: int64
            type: integer
        - description: works = attach the works this character appears in
          explode: false
          in: query
          name: include
          schema:
            description: works = attach the works this character appears in
            type: string
        - description: true/1 = include r18 works and sexual-family traits (default false = both dropped)
          explode: false
          in: query
          name: nsfw
          schema:
            description: true/1 = include r18 works and sexual-family traits (default false = both dropped)
            type: boolean
        - description: max trait spoiler level 0-2 (default 0 = safe)
          explode: false
          in: query
          name: spoilers
          schema:
            description: max trait spoiler level 0-2 (default 0 = safe)
            format: int32
            type: integer
        - description: Works per page 1-50 (default 50); above 50 is clamped to 50, a non-positive or non-numeric value is a 400
          explode: false
          in: query
          name: limit
          schema:
            description: Works per page 1-50 (default 50); above 50 is clamped to 50, a non-positive or non-numeric value is a 400
            format: int64
            type: integer
        - description: Rows to skip
          explode: false
          in: query
          name: offset
          schema:
            description: Rows to skip
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicCharacter"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Character identity; include=works attaches the works it appears in with voice names
      tags:
        - catalog-public
  /v1/catalog/engines:
    get:
      description: The visual-novel / game engines works are built with, id ascending. work_count is the number of works THIS caller would page through via works?engine_id=<id>.
      operationId: listCatalogEnginesPublic
      parameters:
        - description: Opaque keyset cursor from a prior next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior next_cursor; omit for the first page
            type: string
        - description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 20); above 100 is clamped to 100, a non-positive or non-numeric value is a 400
            format: int64
            type: integer
        - description: true/1 = count r18 works in work_count (default false = excluded, matching what an sfw works?engine_id= call returns)
          explode: false
          in: query
          name: nsfw
          schema:
            description: true/1 = count r18 works in work_count (default false = excluded, matching what an sfw works?engine_id= call returns)
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicEnginesListData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Keyset engine browse lane (id ASC); each row carries an nsfw-aware work_count
      tags:
        - catalog-public
  /v1/catalog/engines/{id}:
    get:
      operationId: getCatalogEnginePublic
      parameters:
        - description: Catalog engine id
          in: path
          name: id
          required: true
          schema:
            description: Catalog engine id
            format: int64
            type: integer
        - description: true/1 = count r18 works in work_count (default false = excluded)
          explode: false
          in: query
          name: nsfw
          schema:
            description: true/1 = count r18 works in work_count (default false = excluded)
            type: boolean
      responses:
        "200":
          content:
            application/json:
