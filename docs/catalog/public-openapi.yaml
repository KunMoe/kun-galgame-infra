    PlaytimeBatchBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PlaytimeBatchBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Up to 200 reports. Each item is accepted or rejected on its own — a bad item never fails the batch
          items:
            $ref: "#/components/schemas/PlaytimeBatchItem"
          maxItems: 200
          minItems: 1
          type:
            - array
            - "null"
      required:
        - items
      type: object
    PlaytimeBatchItem:
      additionalProperties: false
      properties:
        external_id:
          description: The id this game carries on that source (e.g. v17, RJ01234)
          type: string
        last_played_at:
          description: When this client last saw the game running (RFC 3339). Optional
          format: date-time
          type: string
        minutes:
          description: Absolute cumulative playtime in MINUTES (never a delta)
          format: int64
          maximum: 60000
          minimum: 0
          type: integer
        source:
          description: External source key (vndb, dlsite, getchu, bangumi, …). Use WITH external_id when work_id is omitted
          type: string
        status:
          description: Defaults to playing
          enum:
            - playing
            - finished
            - dropped
            - on_hold
          type: string
        work_id:
          description: Catalog work id. Omit to address by source/external_id instead
          format: int64
          type: integer
      required:
        - minutes
      type: object
    PlaytimeBatchResponse:
      additionalProperties: false
      properties:
        accepted:
          format: int64
          type: integer
        refused:
          format: int64
          type: integer
        results:
          items:
            $ref: "#/components/schemas/PlaytimeBatchResult"
          type:
            - array
            - "null"
      required:
        - accepted
        - refused
        - results
      type: object
    PlaytimeBatchResult:
      additionalProperties: false
      properties:
        error:
          type: string
        index:
          format: int64
          type: integer
        status:
          enum:
            - ok
            - not_found
            - rejected
          type: string
        work_id:
          format: int64
          type: integer
      required:
        - index
        - status
      type: object
    PlaytimeMineResponse:
      additionalProperties: false
      properties:
        cursor:
          type:
            - string
            - "null"
        items:
          items:
            $ref: "#/components/schemas/PlaytimeRecordResponse"
          type:
            - array
            - "null"
      required:
        - items
        - cursor
      type: object
    PlaytimeRecordResponse:
      additionalProperties: false
      properties:
        client_id:
          type: string
        last_played_at:
          type:
            - string
            - "null"
        minutes:
          format: int64
          type: integer
        resolved_from:
          type: string
        status:
          type: string
        updated_at:
          type: string
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - minutes
        - status
        - last_played_at
        - client_id
        - updated_at
      type: object
    PlaytimeReportBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PlaytimeReportBody.json
          format: uri
          readOnly: true
          type: string
        last_played_at:
          description: When this client last saw the game running (RFC 3339). Optional
          format: date-time
          type: string
        minutes:
          description: Absolute cumulative playtime in MINUTES (never a delta). Ceiling 60000 (1000 hours)
          format: int64
          maximum: 60000
          minimum: 0
          type: integer
        status:
          description: Defaults to playing. ONLY finished reports feed the public aggregate
          enum:
            - playing
            - finished
            - dropped
            - on_hold
          type: string
      required:
        - minutes
      type: object
    PlaytimeSelfResponse:
