  /v1/catalog/releases:
    get:
      description: "The calendar one grain down. /v1/catalog/calendar places a WORK in the month of its EARLIEST release and shows it once, so a Switch port, a Steam re-issue or a Chinese localisation of a title released years ago is invisible there by construction. Here every release row is its own item, on its own date. is_first tells the two apart: true = the work's earliest dated release (a title genuinely coming out), false = a later edition of something already released — computed over the work's whole dated-release set, so it does not change when you narrow the feed. Each item carries the parent work as a works-list row (include= and all). Population: releases of LIVE galgame works whose date is known to at least the MONTH. Year-only and undated releases are deliberately absent — they cannot be ordered against a real date, and they already have homes in /v1/catalog/calendar/pending and /v1/catalog/calendar/tba. Carries a feed-level ETag (count + newest created_at + highest release id over the whole filtered set): an If-None-Match hit 304s before any page is loaded."
      operationId: listCatalogReleasesPublic
      parameters:
        - description: date_desc (default) = newest first, the feed reading; date_asc walks forwards from the earliest release. The tiebreak inside one date is id ASC in BOTH directions. Keyset-paged over (date, id) — a cursor minted in one direction is refused in the other
          explode: false
          in: query
          name: sort
          schema:
            description: date_desc (default) = newest first, the feed reading; date_asc walks forwards from the earliest release. The tiebreak inside one date is id ASC in BOTH directions. Keyset-paged over (date, id) — a cursor minted in one direction is refused in the other
            enum:
              - date_desc
              - date_asc
            type: string
        - description: "YYYY-MM-DD, INCLUSIVE lower bound on the release's own date. Note the precision rule: a month-precision release is addressed at its month's START (2024-06 sits at 2024-06-00, i.e. before 2024-06-01), so date_from=2024-06-01 excludes it while date_from=2024-05-31 includes it. A malformed value is a 400"
          explode: false
          in: query
          name: date_from
          schema:
            description: "YYYY-MM-DD, INCLUSIVE lower bound on the release's own date. Note the precision rule: a month-precision release is addressed at its month's START (2024-06 sits at 2024-06-00, i.e. before 2024-06-01), so date_from=2024-06-01 excludes it while date_from=2024-05-31 includes it. A malformed value is a 400"
            type: string
        - description: YYYY-MM-DD, INCLUSIVE upper bound, same ordinal and the same precision rule as date_from. A malformed value is a 400
          explode: false
          in: query
          name: date_to
          schema:
            description: YYYY-MM-DD, INCLUSIVE upper bound, same ordinal and the same precision rule as date_from. A malformed value is a 400
            type: string
        - description: "Original-language gate on the PARENT WORK: comma-separated olang values in the upstream BCP-47 spelling (ja, zh-Hans, en, …) or 'all' to switch it off. Default = the ja + zh* family. olang is an OPEN vocabulary, so an unrecognized value yields an empty feed, never a 400. This is the work's original language, NOT the language of the release — for that use lang= below"
          explode: false
          in: query
          name: olang
          schema:
            description: "Original-language gate on the PARENT WORK: comma-separated olang values in the upstream BCP-47 spelling (ja, zh-Hans, en, …) or 'all' to switch it off. Default = the ja + zh* family. olang is an OPEN vocabulary, so an unrecognized value yields an empty feed, never a 400. This is the work's original language, NOT the language of the release — for that use lang= below"
            type: string
        - description: "RELEASE-language gate: comma-separated BCP-47 tags, or 'all'. Default (absent) = NO gate. Matched over COALESCE(release.lang, work.olang): the store-SKU lanes (dlsite / getchu) create one release per work and record no language of its own, and such a SKU is by construction in its work's original language — so lang=ja matches them, while the item still prints the raw (possibly empty) release lang. An OPEN vocabulary: an unknown tag is an empty feed, never a 400"
          explode: false
          in: query
          name: lang
          schema:
            description: "RELEASE-language gate: comma-separated BCP-47 tags, or 'all'. Default (absent) = NO gate. Matched over COALESCE(release.lang, work.olang): the store-SKU lanes (dlsite / getchu) create one release per work and record no language of its own, and such a SKU is by construction in its work's original language — so lang=ja matches them, while the item still prints the raw (possibly empty) release lang. An OPEN vocabulary: an unknown tag is an empty feed, never a 400"
            type: string
        - description: "Comma-separated CLOSED vocabulary: default,digital,physical,trial,patch — the five strings each item's kind key prints. An unknown token is a 400. DEFAULT (absent) = default,digital,physical ONLY: this is a 发售动态 surface, so demos and translation patches are EXCLUDED unless you ask for them. Pass kind=default,digital,physical,trial,patch for the genuinely unfiltered feed, or kind=patch to watch localisations land"
          explode: false
          in: query
          name: kind
          schema:
            description: "Comma-separated CLOSED vocabulary: default,digital,physical,trial,patch — the five strings each item's kind key prints. An unknown token is a 400. DEFAULT (absent) = default,digital,physical ONLY: this is a 发售动态 surface, so demos and translation patches are EXCLUDED unless you ask for them. Pass kind=default,digital,physical,trial,patch for the genuinely unfiltered feed, or kind=patch to watch localisations land"
            type: string
        - description: Gate on the release's official flag; absent = no gate. The flag is written by the VNDB release lane only, where false means a fan translation or unofficial edition — a row WITHOUT the key counts as OFFICIAL, because every other lane materialises store SKUs (dlsite worknos, getchu product pages) which are official by construction. official=true therefore drops only the explicitly-unofficial rows; official=false selects exactly those
          explode: false
          in: query
          name: official
          schema:
            description: Gate on the release's official flag; absent = no gate. The flag is written by the VNDB release lane only, where false means a fan translation or unofficial edition — a row WITHOUT the key counts as OFFICIAL, because every other lane materialises store SKUs (dlsite worknos, getchu product pages) which are official by construction. official=true therefore drops only the explicitly-unofficial rows; official=false selects exactly those
            enum:
              - "true"
              - "false"
            type: string
        - description: "vndb platform code (win/and/ios/…) matched against the release's PRIMARY platform — the release leg of the works-list filter of the same name, verbatim. A release's platforms[] display list is not filtered on. OPEN vocabulary: an unknown code is an empty feed, never a 400"
          explode: false
          in: query
          name: platform
          schema:
