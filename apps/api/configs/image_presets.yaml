# Image Service preset configuration.
#
# main_pipeline is the global compression policy applied to every uploaded
# image regardless of preset. Each preset additionally declares variants
# (extra derivative images to generate on top of the main one).

main_pipeline:
  fit_width: 1920
  fit_height: 1080
  format: webp
  quality: 77
  strip_exif: true

presets:
  # User avatars. 256 is the main display size (square, cover). 100 is for
  # comments / small mentions.
  avatar:
    variants:
      - name: "256"
        width: 256
        height: 256
        fit: cover
        format: webp
        quality: 77
      - name: "100"
        width: 100
        height: 100
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # galgame wiki banner thumbnails (aspect-preserving fill to 460x259).
  galgame_banner:
    variants:
      - name: "mini"
        width: 460
        height: 259
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # galgame wiki gallery screenshots. The gallery grid renders a `mini`
  # thumbnail (460x259, matching galgame_banner) while the lightbox shows the
  # full image. Split out for the same reasons `message` is split from `topic`:
  # its own CDN folder + independent quota gating, and an explicit name for the
  # "galgame screenshot" asset.
  # Before this preset existed kungal reused `galgame_banner` and moyu reused
  # `topic` — neither expressed intent and the two diverged. MIME is the union
  # of both old presets (incl. gif) so migrating either consumer onto this name
  # is non-breaking.
  galgame_screenshot:
    variants:
      - name: "mini"
        width: 460
        height: 259
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

  # Catalog character portraits (the shared cross-media entity layer). VNDB
  # character images are small, vertical head/bust shots; the `mini` variant is
  # a portrait-oriented thumbnail for character cards / roster grids (the same
  # "one mini variant" shape as the galgame cover presets, just portrait rather
  # than landscape). Uploaded under site_key "catalog" by the step-48 backfill.
  character:
    variants:
      - name: "mini"
        width: 256
        height: 360
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # Character FULL-BODY standing art (立绘 / tachi-e), written to
  # catalog_character.figure_hash by internal/jobs/getchuportraits --slot figure.
  #
  # fit `inside`, NOT `cover`, and that is the whole reason this preset exists
  # rather than reusing `character`. The source is a whole figure standing on a
  # white field (Getchu ships them 500x500); cover-cropping that to a 2:3
  # portrait box throws away both sides and leaves a picture of someone's
  # midriff. `inside` shrinks to fit and preserves the aspect, so the figure
  # survives whatever its proportions are.
  #
  # Uploaded under site_key "catalog"; the catalog client's
  # image_allowed_presets MUST list it or every upload is 403'd.
  character_figure:
    variants:
      - name: "mini"
        width: 360
        height: 360
        fit: inside
        format: webp
        quality: 80
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # Catalog BODYLESS work covers (media-aggregation wave, step 55). DLsite store
  # covers are LANDSCAPE package shots (~560x420); the main image is the global
  # main_pipeline output (≤1920x1080 webp) and `mini` is a 460x259 landscape
  # thumbnail matching galgame_banner (the cover thumbnail the grid renders).
  # Uploaded under site_key "catalog"; the catalog client's image_allowed_presets
  # MUST include it (ops/DB change on the image service) or every upload 403s.
  catalog_cover:
    variants:
      - name: "mini"
        width: 460
        height: 259
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

  # Catalog BODYLESS work screenshots (media-aggregation wave, step 55). DLsite
  # sample images; the gallery grid renders a `mini` 460x259 thumbnail (matching
  # galgame_screenshot) while the lightbox shows the main image. Uploaded under
  # site_key "catalog"; the catalog client's image_allowed_presets MUST include it.
  catalog_screenshot:
    variants:
      - name: "mini"
        width: 460
        height: 259
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

  # Catalog LABEL brand logos / circle avatars (wave 170,
  # internal/jobs/labellogos), written to catalog_label.logo_hash.
  #
  # fit `inside`, NOT `cover`: a brand logo is whatever shape its designer made
  # it — a wide wordmark, a square circle avatar, a tall crest. Cover-cropping a
  # wordmark to a square box cuts the brand's own name in half, which is the one
  # thing a logo may not survive. `inside` shrinks to fit and keeps the aspect,
  # so every shape renders whole (same reasoning as character_figure).
  #
  # Uploaded under site_key "catalog"; the catalog client's
  # image_allowed_presets MUST list `catalog_logo` or every upload is 403'd.
  catalog_logo:
    variants:
      - name: "mini"
        width: 360
        height: 360
        fit: inside
        format: webp
        quality: 80
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

  # Partner news banners (月幕 / Galgame 批评). 460x259 matches galgame_banner
  # because downstream renders both in the same card slot; a second banner
  # geometry would buy nothing but another CDN folder.
  #
  # Uploaded under site_key "news"; that client's image_allowed_presets MUST
  # list `news_banner` or every upload is 403'd.
  news_banner:
    variants:
      - name: "mini"
        width: 460
        height: 259
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # Galgame sticker / emoji-pack frames. Square-ish expression crops; `inside`
  # keeps ahoge and full character (same reason as character_figure — cover
  # would clip). `320` is the pack-grid card; `128` is the home-row preview.
  # Uploaded under site_key "sticker"; that client's image_allowed_presets MUST
  # list `sticker` or every upload is 403'd.
  sticker:
    variants:
      - name: "320"
        width: 320
        height: 320
        fit: inside
        format: webp
        quality: 80
      - name: "128"
        width: 128
        height: 128
        fit: inside
        format: webp
        quality: 80
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # Topic / inline post images. Main image only; no extra variants.
  topic:
    variants: []
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

  # Private-message / chat inline images. Same handling as topic (main image
  # only; global main_pipeline applies: webp q77, ≤1920×1080, EXIF stripped).
  # Kept as its own preset so chat images get their own CDN folder + can be
  # quota-gated independently of topic uploads.
  message:
    variants: []
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
